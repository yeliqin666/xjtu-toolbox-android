[versions]
agp = "9.4.0"
kotlin = "2.4.10"
ksp = "2.3.9"
room = "2.7.1"
work = "2.10.1"
coreKtx = "1.15.0"
coreSplashscreen = "1.0.1"
lifecycleRuntimeKtx = "2.8.7"
activityCompose = "1.12.0"
# miuix 不钉版本：始终解析 Maven Central 上的最新正式版（rc/alpha/beta 会被
# app/build.gradle.kts 里的 componentSelection 规则拒掉）。每次构建都会查一次远端，
# 本地 Gradle 缓存只是缓存；离线构建（--offline）用缓存里最近解析到的那一版。
miuix = "latest.release"
# Compose 的实际版本由 miuix 带进来的 JetBrains Compose 决定（冲突仲裁取最高版本），
# 这里的 BOM 必须和实际解析结果一致，否则 toml 里写的和真正用的对不上，出了问题很难查。
# 2026.08.00 对应 ui / foundation / animation 1.12.0。升级 miuix 以后重跑一次
# `./gradlew :app:dependencyInsight --configuration releaseRuntimeClasspath --dependency androidx.compose.ui:ui` 核对。
composeBom = "2026.08.00"
# material-icons-extended 已经冻结在 1.7.x，这个 BOM 带的是 1.7.8（原来解析到 1.7.7）。
# 不另外钉版本：普通版本号压不过 BOM 的约束，写了也不生效，反而误导人。
okhttp = "4.12.0"
# 社区（GitHub Discussions）的 Markdown 渲染
markdownRenderer = "0.45.0"
# 社区的头像和帖子图片。coil-network-okhttp 3.6.3 要求的正是 OkHttp 4.12.0，不会把 OkHttp 抬到 5.x
coil = "3.6.3"
jsoup = "1.18.3"
flexmark = "0.64.8"
gson = "2.11.0"
coroutines = "1.8.1"
securityCrypto = "1.0.0"
zxing = "3.5.3"
camerax = "1.4.1"
lifecycleRuntimeCompose = "2.8.7"
media3 = "1.6.1"
# 液态玻璃（手机底栏等），Apache-2.0。依赖的 ui / foundation 也是 1.12.0，不会拉高版本。
backdrop = "2.0.1"
# 形状形变（加载动画），不依赖 material3。
graphicsShapes = "1.1.0"
# miuix-nav 的返回栈要靠它序列化，版本不低于 miuix 所用的版本。
kotlinxSerialization = "1.11.0"
junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"
# Baseline Profile 一套：benchmark 同时提供 macrobenchmark 测试库与 androidx.baselineprofile
# 插件（同一版本线，必须一致）；profileinstaller 让侧载 APK 也能在首启时装上 profile。
benchmark = "1.5.0"
profileinstaller = "1.4.1"
uiautomator = "2.4.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "coreSplashscreen" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
markdown-renderer = { group = "com.mikepenz", name = "multiplatform-markdown-renderer", version.ref = "markdownRenderer" }
markdown-renderer-coil3 = { group = "com.mikepenz", name = "multiplatform-markdown-renderer-coil3", version.ref = "markdownRenderer" }
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }
androidx-material-icons = { group = "androidx.compose.material", name = "material-icons-extended" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-brotli = { group = "com.squareup.okhttp3", name = "okhttp-brotli", version.ref = "okhttp" }
okhttp-urlconnection = { group = "com.squareup.okhttp3", name = "okhttp-urlconnection", version.ref = "okhttp" }
jsoup = { group = "org.jsoup", name = "jsoup", version.ref = "jsoup" }
flexmark-html2md = { group = "com.vladsch.flexmark", name = "flexmark-html2md-converter", version.ref = "flexmark" }
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxing" }
androidx-camera-core = { group = "androidx.camera", name = "camera-core", version.ref = "camerax" }
androidx-camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
androidx-camera-view = { group = "androidx.camera", name = "camera-view", version.ref = "camerax" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntimeCompose" }
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
