name: Desktop Windows Packaging

# 出 .exe 安装包（jpackage 不能交叉构建，只能在 Windows 上打）。PR 上只在打包配置、图标、版本目录或
# DPAPI 代码变动时跑，并在真 Windows 上验 DPAPI（Linux 上这几条会自行跳过）；
# 正式发版时由 build.yml 在安卓 Release 发完后调用，把产物挂到同一个 Release（不走 OSS）。

on:
  pull_request:
    paths:
      - 'desktop/build.gradle.kts'
      - 'desktop/icons/**'
      - 'gradle/libs.versions.toml'
      - 'shared/data/src/jvmMain/kotlin/com/xjtu/toolbox/platform/**'
      - 'shared/data/src/jvmTest/kotlin/com/xjtu/toolbox/platform/**'
      - '.github/workflows/desktop-windows.yml'
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: true
  workflow_dispatch:

concurrency:
  group: desktop-windows-${{ github.ref }}-${{ inputs.release_tag }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - uses: gradle/actions/setup-gradle@v4

      - name: DPAPI 凭据保护测试
        if: inputs.release_tag == ''
        run: .\gradlew.bat :shared:data:jvmTest --tests "com.xjtu.toolbox.platform.*"

      # JDK 21 的 jpackage 用 WiX v3；只认 ≥3.14（3.11 要 .NET 3.5，镜像不带），并用 WIX_PATH 阻止 Compose 去下旧版
      - name: 准备 WiX
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Find-WixBin {
            Get-ChildItem 'C:\Program Files (x86)\WiX Toolset*', 'C:\Program Files\WiX Toolset*' -Directory -ErrorAction SilentlyContinue |
              ForEach-Object { Join-Path $_.FullName 'bin' } |
              Where-Object { (Test-Path "$_\light.exe") -and ((Get-Item "$_\light.exe").VersionInfo.FileVersion -match '^3\.(1[4-9]|[2-9]\d)') } |
              Sort-Object -Descending | Select-Object -First 1
          }
          $bin = Find-WixBin
          if (-not $bin) { choco install wixtoolset --no-progress -y; $bin = Find-WixBin }
          if (-not $bin) { throw "找不到 ≥3.14 的 WiX" }
          "WIX_PATH=$bin" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "WIX_PATH=$bin"
          exit 0

      # light.exe 偶发无输出退出 311：排除 Defender 实时扫描并重试 3 次
      - name: 打 .exe
        shell: pwsh
        env:
          FEEDBACK_APP_ID: ${{ secrets.FEEDBACK_APP_ID }}
          FEEDBACK_APP_SECRET: ${{ secrets.FEEDBACK_APP_SECRET }}
          FEEDBACK_BASE_TOKEN: ${{ secrets.FEEDBACK_BASE_TOKEN }}
          FEEDBACK_TABLE_SUBMIT: ${{ secrets.FEEDBACK_TABLE_SUBMIT }}
          FEEDBACK_TABLE_REPLY: ${{ secrets.FEEDBACK_TABLE_REPLY }}
          # jpackage 按自身 locale 选 MSI 的主 culture：zh_CN ⇒ 用 JDK 自带的中文 wxl（代码页 936），
          # 中文应用名「岱宗盒子」才放得进 MSI；默认 en-us（代码页 1252）时 light.exe 报 LGHT0311（exit 311）
          JAVA_TOOL_OPTIONS: -Duser.language=zh -Duser.country=CN
        run: |
          foreach ($p in @($env:GITHUB_WORKSPACE, $env:RUNNER_TEMP, $env:TEMP)) {
            try { Add-MpPreference -ExclusionPath $p -ErrorAction Stop } catch { Write-Host "::warning::Defender 排除失败：$p" }
          }
          for ($i = 1; $i -le 3; $i++) {
            .\gradlew.bat :desktop:packageExe --info --stacktrace
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "第 $i 次出包失败（exit=$LASTEXITCODE）"
            if ($i -lt 3) { Start-Sleep -Seconds 20 }
          }
          throw "连续 3 次出包失败，看 desktop/build/compose/logs/ 下的 jpackage 日志"

      # 安装包按应用名「岱宗盒子-x.y.z.exe」产出；GitHub 会把资产名里的非 ASCII 字符换掉，上传前改回 ASCII
      - name: 安装包改成 ASCII 文件名
        shell: pwsh
        run: |
          Get-ChildItem desktop\build\compose\binaries\main\exe\*.exe | ForEach-Object {
            $version = $_.BaseName -replace '^.*-', ''
            Rename-Item $_.FullName "xjtu-dzhz-$version.exe"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: xjtu-dzhz-windows
          path: desktop/build/compose/binaries/main/exe/*.exe
          if-no-files-found: error

      - name: 挂到 Release
        if: inputs.release_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # @() 保证只有一个文件时也是数组，原样展开成各自一个参数
          $files = @(Get-ChildItem desktop\build\compose\binaries\main\exe\*.exe | ForEach-Object FullName)
          gh release upload "${{ inputs.release_tag }}" --repo "${{ github.repository }}" --clobber $files
          if ($LASTEXITCODE -ne 0) { throw "上传 Release 失败" }

      - name: 失败时保留诊断报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-failure-reports
          retention-days: 7
          if-no-files-found: warn
          path: |
            shared/data/build/reports/tests/**
            desktop/build/compose/logs/**
            desktop/build/compose/tmp/*.args.txt
