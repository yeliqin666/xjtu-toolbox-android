name: Announce

# 讨论区公告分类（slug announcements）= App 公告的唯一编辑处（发帖表单见 .github/DISCUSSION_TEMPLATE/announcements.yml，
# 文件名必须是分类的 slug，GitHub 不认中文 slug，所以分类名要保持英文 slug；
# 解析和统计见 .github/scripts/announce.py）。生成的 JSON 提交到 GitHub 的 announce 分支，再把这个分支原样推到
# Gitee，bulletin.json 再传一份到 OSS：App 同时读 OSS 和 Gitee、按 updatedAt 取较新的，都不行再读 GitHub。
#
#   讨论区有变动：重建 bulletin.json；首次发布写一行飞书公告表、帖子里回一条解析结果；关帖 = 删除
#   每 4 天（北京时间 09:17，避开整点；每月 1、5、9…号）：统计投票（最终结果写进帖子后删掉飞书里的票）、
#   过了截止时间的公告和投票关帖撤下、从飞书生成 feedback-qa.json（大家在问），再重建
#   手动：workflow_dispatch = 每 4 天那一趟，可选 dry_run（只打印，不提交、不回帖、不写飞书）
#
# GITHUB_TOKEN 推的提交不会触发 announce 分支上的 sync-announce（它会传 OSS），这里自己推 Gitee。
# discussion 事件只认默认分支上的 workflow，改动要先合到 main。

on:
  discussion:
    types: [created, edited, deleted, closed, reopened, category_changed]
  schedule:
    - cron: '17 1 */4 * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只打印，不提交、不回帖、不写飞书'
        type: boolean
        default: false

permissions:
  contents: write
  discussions: write

concurrency:
  group: announce
  cancel-in-progress: false

jobs:
  announce:
    # 别的分类的帖子不管；改分类可能是移进 / 移出，都重建一次
    if: >-
      github.event_name != 'discussion' ||
      github.event.discussion.category.slug == (vars.ANNOUNCE_CATEGORY || 'announcements') ||
      github.event.action == 'category_changed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
      OUT_DIR: announce
      ANNOUNCE_CATEGORY: ${{ vars.ANNOUNCE_CATEGORY || 'announcements' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: announce
          path: announce
          fetch-depth: 0

      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FEEDBACK_APP_ID: ${{ secrets.FEEDBACK_APP_ID }}
          FEEDBACK_APP_SECRET: ${{ secrets.FEEDBACK_APP_SECRET }}
          FEEDBACK_BASE_TOKEN: ${{ secrets.FEEDBACK_BASE_TOKEN }}
          FEEDBACK_TABLE_SUBMIT: ${{ secrets.FEEDBACK_TABLE_SUBMIT }}
          FEEDBACK_TABLE_REPLY: ${{ secrets.FEEDBACK_TABLE_REPLY }}
          FEEDBACK_TABLE_NOTICE: ${{ secrets.FEEDBACK_TABLE_NOTICE }}
        run: python3 .github/scripts/announce.py ${{ github.event_name == 'discussion' && 'event' || 'tally' }}

      - name: Commit to announce
        id: commit
        if: env.DRY_RUN != '1'
        working-directory: announce
        run: |
          git add -A
          if git diff --cached --quiet; then echo "没有变化"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "公告：由讨论区公告分类生成"
          git push -q origin HEAD:announce
          echo "pushed=1" >> "$GITHUB_OUTPUT"

      - name: Mirror to Gitee
        if: steps.commit.outputs.pushed == '1'
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_ACCESS_TOKEN }}
          GIT_TERMINAL_PROMPT: "0"
        working-directory: announce
        run: |
          test -n "$GITEE_TOKEN" || { echo "::error::GITEE_ACCESS_TOKEN missing"; exit 1; }
          bash "$GITHUB_WORKSPACE/.github/scripts/gitee_push.sh" HEAD refs/heads/announce

      # 公告也放一份到 OSS：App 同时读 OSS 和 Gitee 取较新的（旧版本只读 OSS）。
      # GITHUB_TOKEN 推的提交不会触发 announce 分支上的 sync-announce，所以在这里自己传。
      # 清单类对象在 ESA 上是不缓存的（见 docs/release.md），传完不需要刷缓存。
      - name: Upload bulletin to OSS
        if: steps.commit.outputs.pushed == '1'
        continue-on-error: true
        timeout-minutes: 5
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check --timeout 30 --retries 3 oss2
          python3 .github/scripts/oss_upload.py announce/bulletin.json "xjtu-toolbox/bulletin.json" "no-cache"
