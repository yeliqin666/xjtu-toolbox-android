name: Announce

# 讨论区公告分类（slug announcements）= App 公告的唯一编辑处（发帖表单见 .github/DISCUSSION_TEMPLATE/announcements.yml，
# 文件名必须是分类的 slug，GitHub 不认中文 slug，所以分类名要保持英文 slug；
# 解析和统计见 .github/scripts/announce.py）。生成的 JSON 提交到 GitHub 的 announce 分支，再传一份到 OSS：
# App 先读 OSS，读不到再读 GitHub。
#
#   讨论区有变动：重建 bulletin.json、帖子里回一条解析结果（不碰反馈后端）；关帖 = 删除
#   每 4 天（北京时间 09:17，避开整点；每月 1、5、9…号）：统计投票（最终结果写进帖子后删掉后端里的票）、
#   过了截止时间的公告和投票关帖撤下、从反馈后端生成 feedback-qa.json（大家在问），再重建
#   手动：workflow_dispatch = 每 4 天那一趟，可选 dry_run（只打印，不提交、不回帖、不写后端）
#
# GITHUB_TOKEN 推的提交不会触发 announce 分支上的 sync-announce（它会传 OSS），这里自己传。
# discussion 事件只认默认分支上的 workflow，改动要先合到 main。

on:
  discussion:
    types: [created, edited, deleted, closed, reopened, category_changed]
  schedule:
    - cron: '17 1 */4 * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只打印，不提交、不回帖、不写反馈后端'
        type: boolean
        default: false
      poll:
        description: '只统计这一帖的投票（帖子号，评论区 /tally 派发）；留空 = 完整的 tally'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  discussions: write

concurrency:
  group: announce
  cancel-in-progress: false

jobs:
  announce:
    # 别的分类的帖子不管；改分类可能是移进 / 移出，都重建一次
    if: >-
      github.event_name != 'discussion' ||
      github.event.discussion.category.slug == (vars.ANNOUNCE_CATEGORY || 'announcements') ||
      github.event.action == 'category_changed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
      OUT_DIR: announce
      ANNOUNCE_CATEGORY: ${{ vars.ANNOUNCE_CATEGORY || 'announcements' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: announce
          path: announce
          fetch-depth: 0

      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FEEDBACK_BASE_URL: ${{ vars.FEEDBACK_BASE_URL || 'https://api.dzhz.top/feedback' }}
          FEEDBACK_ADMIN_TOKEN: ${{ secrets.FEEDBACK_ADMIN_TOKEN }}
          # 定时触发时为空串，只有手动 / 评论区 /tally 派发才有值
          POLL_NUMBER: ${{ github.event.inputs.poll }}
        run: |
          if [ "${{ github.event_name }}" = "discussion" ]; then mode=event
          elif [ -n "$POLL_NUMBER" ]; then mode=poll
          else mode=tally; fi
          python3 .github/scripts/announce.py "$mode"

      - name: Commit to announce
        id: commit
        if: env.DRY_RUN != '1'
        working-directory: announce
        run: |
          git add -A
          if git diff --cached --quiet; then echo "没有变化"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "公告：由讨论区公告分类生成"
          git push -q origin HEAD:announce
          echo "pushed=1" >> "$GITHUB_OUTPUT"

      # 公告放一份到 OSS（App 同时读 OSS 和 GitHub，取 updatedAt 较新的）。
      # GITHUB_TOKEN 推的提交不会触发 announce 分支上的 sync-announce，所以在这里自己传。
      # 每趟都传、都刷：重传是幂等的，手动跑一次就能把 CDN 上的旧公告换掉。
      - name: Upload bulletin to OSS
        id: oss
        if: env.DRY_RUN != '1'
        continue-on-error: true
        timeout-minutes: 5
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check --timeout 30 --retries 3 oss2
          python3 .github/scripts/oss_upload.py announce/bulletin.json "xjtu-toolbox/bulletin.json" "no-cache"
          if [ -f announce/feedback-qa.json ]; then
            python3 .github/scripts/oss_upload.py announce/feedback-qa.json "xjtu-toolbox/feedback-qa.json" "no-cache"
          fi

      # ESA 实测会缓存 bulletin.json（命中时缓存期约 30 天），不认源站的 no-cache，传完必须主动刷
      - name: Purge ESA cache for bulletin
        if: steps.oss.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        env:
          ESA_SITE_ID: ${{ secrets.ESA_SITE_ID }}
          ESA_ACCESS_KEY_ID: ${{ secrets.ESA_ACCESS_KEY_ID }}
          ESA_ACCESS_KEY_SECRET: ${{ secrets.ESA_ACCESS_KEY_SECRET }}
        run: |
          if [ -n "$ESA_SITE_ID" ]; then
            python3 -m pip install --quiet --disable-pip-version-check --timeout 30 --retries 3 alibabacloud_esa20240910 \
              || { echo "::warning::装不上 ESA SDK，跳过缓存刷新"; exit 0; }
          fi
          python3 .github/scripts/esa_purge.py bulletin.json feedback-qa.json
