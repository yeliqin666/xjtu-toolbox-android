name: Storage regression checks

on:
  pull_request:
    paths:
      - 'app/src/main/java/com/xjtu/toolbox/data/**'
      - 'app/src/main/java/com/xjtu/toolbox/account/**'
      - 'app/src/test/java/com/xjtu/toolbox/data/**'
      - 'shared/model/src/**/kotlin/com/xjtu/toolbox/platform/**'
      - 'shared/data/src/**/kotlin/com/xjtu/toolbox/platform/**'
      - '.github/workflows/storage-regression.yml'
      - '.github/scripts/check-storage-regression.py'
      - '.github/scripts/test-storage-regression-validator.py'
      - '**/build.gradle.kts'
      - 'gradle/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: storage-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  comparison:
    name: Original vs repaired storage (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Test the report validator itself
        run: python3 .github/scripts/test-storage-regression-validator.py
      - name: Install Android SDK 37
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" --channel=3 > /dev/null
      - name: Run the same assertions on both revisions
        run: python3 .github/scripts/check-storage-regression.py
      - name: Preserve original and repaired test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storage-regression-linux
          path: storage-regression-reports/**
          if-no-files-found: warn
          retention-days: 7

  windows:
    name: File storage and credential tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Test filesystem semantics and credential protection
        shell: pwsh
        run: |
          .\gradlew.bat --continue :shared:model:jvmTest --tests "com.xjtu.toolbox.platform.*" :shared:data:jvmTest --tests "com.xjtu.toolbox.platform.*"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve Windows test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storage-regression-windows
          path: |
            shared/model/build/test-results/jvmTest/**
            shared/data/build/test-results/jvmTest/**
          if-no-files-found: error
          retention-days: 7
