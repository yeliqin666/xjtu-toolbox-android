name: Core KMP Gate

# :core 的 KMP 卫生门禁：让 commonMain 编一个非 JVM 目标，把 android.* / java.* / 只有 JVM 变体的库一次拦下。

on:
  pull_request:
    # 只改文档的 PR 不跑 wasm 编译与全量 jvmTest；手动触发不受此限制。
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: core-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: commonMain 必须能编到非 JVM 目标
        # 这一条就是门禁本体：Android/AndroidX/JVM-only 依赖一进来就红
        run: ./gradlew :core:compileKotlinWasmJs

      - name: :core 与 :web 两个模块都必须能编到 wasmJs
        # :web 是真正吃 :core 的非 Android 端。它编得过，就说明 :core 的公开面在浏览器目标上成立。
        run: ./gradlew :core:compileKotlinWasmJs :web:compileKotlinWasmJs

      - name: 装中日字体（共享模块的离屏布局测试需要）
        # ubuntu-latest 镜像没有中日字体 ⇒ 字形缺失、文字量出来的尺寸不对，而
        # :feature:schedule 的 ExamCardLayoutTest 与 :feature:settings 的 CustomThemeTest
        # 都在离屏渲染后断言中文文本的布局。装完用 fc-list 响亮自检：镜像/包一旦变了
        # 就在这里红，而不是让人去猜后面那些断言。桌面端的同类断言在 desktop-linux.yml。
        run: |
          set -x
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-list :lang=zh > "$RUNNER_TEMP/chinese-fonts.txt"
          test -s "$RUNNER_TEMP/chinese-fonts.txt" || { echo "::error::装完 fonts-noto-cjk 仍查不到中文字体"; exit 1; }
          head -3 "$RUNNER_TEMP/chinese-fonts.txt"

      - name: 共享逻辑的单元测试
        # Cookie 会话往返、真实响应夹具、ZCMC 周次展开与学期日期换算（与 J1900 的
        # jwxt2caldav.js::parseZcmc 逐条对齐），都不需要网络也不需要真机。
        # ⚠️ 这里**不跑** :core:wasmJsNodeTest：一旦 :core 依赖 Compose 的 ui-graphics，
        # Node 版测试包会去 import skiko.mjs 而失败（skiko 只为 browser 目标配好了 npm 解析）。
        # wasm 的运行时证明交给 :web 在真浏览器里跑真数据。
        # 拆模块后测试跟着源码走：:shared:*（除 data）与 :feature:* 各跑各的 jvmTest。
        run: >-
          ./gradlew :core:jvmTest
          :shared:model:jvmTest :shared:navigation:jvmTest :shared:designsystem:jvmTest :shared:network:jvmTest
          :feature:account:jvmTest :feature:agent:jvmTest :feature:attendance:jvmTest :feature:campus:jvmTest :feature:community:jvmTest :feature:game:jvmTest :feature:home:jvmTest :feature:jiaocai:jvmTest :feature:library:jvmTest :feature:lms:jvmTest :feature:notice:jvmTest :feature:schedule:jvmTest :feature:score:jvmTest :feature:settings:jvmTest :feature:webvpn:jvmTest

      - name: 数据层（:data）与假上游（:testkit）能编能测，桌面端（:desktop）能编
        # :data 是同一条判据的第二个消费者：它刻意**只有 jvm + android** 两个目标
        # （okhttp 只发布 jvm/android 变体、jsoup 只有一份 JVM jar，加 wasm 立刻编不过），
        # 所以这里不拿它去编 wasm —— 它的可移植性判据是"同一份代码在这两个目标上都编得过 +
        # `LibraryDataLayerJvmTest` 在 JVM 上真跑通（本地 HTTP 服务器 + 域名重写）"。
        #
        # :testkit 是假的校园上游（图书馆座位系统 + 统一认证）—— 它不在任何交付物里，但上面这些
        # 测试都依赖它，所以要单独编一遍（它一旦编不过，两边的失败信息都很难指向真因）。
        #
        # :desktop 这里只做编译（便宜，且覆盖所有 PR）；它的完整测试 :desktop:test 在
        # desktop-linux.yml 里跑 —— 那边的路径过滤覆盖了 :desktop 的全部依赖，别重复跑一遍。
        run: ./gradlew :testkit:compileKotlin :shared:data:compileAndroidMain :shared:data:jvmTest :data:compileAndroidMain :data:jvmTest :desktop:compileKotlin

      - name: wasm 的运行时证明（:web 在真浏览器里跑真数据）
        # 上面那句「wasm 的运行时证明交给 :web 在真浏览器里跑真数据」此前**只写在注释里**，命令里没有 ——
        # 所以这条门禁从来没跑过它。wasm 测试只能在浏览器里跑（nodejs 下 skiko.mjs 解析不了，见上一条），
        # Chrome 由 web/build.gradle.kts 自己找：`-Pchrome.bin` → `CHROME_BIN` → 常见路径探测，
        # ubuntu-latest 自带 /usr/bin/google-chrome ⇒ CI 上**不用**设 CHROME_BIN；容器里跑 Chrome 需要的
        # `--no-sandbox` 也已经由 useChromeHeadlessNoSandbox() 带上。
        # 刻意排在「产证据的那一步」**之后**：本步一旦红，后面的步骤会被跳过 —— 而 CI 红的证据在
        # 数据层/桌面端那一步的 XML 里，不能让一个新门禁把它挡住（失败上传那一步仍然跑得到）。
        run: ./gradlew :web:wasmJsBrowserTest

      - name: 失败时保留诊断报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-gate-failure-reports
          retention-days: 7
          if-no-files-found: warn
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
