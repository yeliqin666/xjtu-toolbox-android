name: Build & Release

on:
  push:
    branches: [ main, dev ]
    # 纯文档 / CI 脚本的提交不跑整条构建：以前改一篇 md 也要十几分钟，还会占住
    # 并发组、把正在跑的代码提交的构建取消掉。
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/DISCUSSION_TEMPLATE/**'
      - '.github/scripts/**'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      publish_preview:
        description: "在 dev 上发布预览版（main 忽略此项）"
        type: boolean
        default: true
      release_preview:
        description: "以 release 方式构建预览版：真 R8、正式签名，版本号仍带 -beta.N；发版前真机检查用，仍不是正式版"
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/dev' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # 发正式版时汇总项目数据（project_story.py）要读 issue、PR、讨论区
      issues: read
      pull-requests: read
      discussions: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      released: ${{ steps.gh_release.outcome }}
      release_body: ${{ steps.notes.outputs.body_json }}
    env:
      # dev 推送默认发布预览版；head commit 带 [skip preview] 时只跑检查、不发布。
      # 手动触发时用 publish_preview 输入控制，便于把之前跳过的改动补发成一个 beta。
      PUBLISH_PREVIEW: ${{ github.ref == 'refs/heads/dev' && ((github.event_name == 'workflow_dispatch' && (github.event.inputs.publish_preview == true || github.event.inputs.publish_preview == 'true')) || (github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip preview]'))) }}
      # 手动在 dev 上勾选 release_preview 时，用正式变体（assembleRelease）出包并发到预览渠道：
      # 包与正式版同一套 R8、同一份签名，版本号仍带 -beta.N（靠 -PpreviewSuffix 补上），
      # 只是不写 stable.json、不动 latest 别名、不打 v* tag、不同步 Gitee，所以它仍然只是预览版。
      # 发版前想拿接近正式版的包在真机上连验几轮，用它；日常预览仍走 preview 变体。
      # 推送时也可以不问人：head commit 带 [release preview] 就走这种方式（与 [skip preview] 同一套约定）。
      PREVIEW_RELEASE_BUILD: ${{ github.ref == 'refs/heads/dev' && ((github.event_name == 'workflow_dispatch' && (github.event.inputs.release_preview == true || github.event.inputs.release_preview == 'true')) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[release preview]'))) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Android SDK 37
        # 与 app/build.gradle.kts 的 compileSdk 37 保持一致（miuix AAR 要求的最低 compileSdk）；
        # 同时保留 36 供 targetSdk 使用
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "platforms;android-36" "build-tools;36.0.0" --channel=3

      - name: Extract version name
        id: version
        run: |
          VERSION=$(grep "versionName" app/build.gradle.kts | head -1 | sed "s/.*\"\(.*\)\".*/\1/")
          VERSION_CODE=$(grep "versionCode" app/build.gradle.kts | head -1 | sed -E "s/.*=[[:space:]]*([0-9]+).*/\1/")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Validate versionCode
        # versionCode 是安装器判升降级的唯一依据（客户端判更新只看 versionName），所以必须
        # 不低于线上任何已发布包；正式版之间还要真正往前推。拦两类真实事故：
        #   1) dev 上把 versionCode 改小 → 新预览包比已装的旧预览低，安装器直接拒绝降级；
        #   2) 忘了递增 → 正式版 code 不高于上一个正式版，用户收不到更新（CONTRIBUTING.md §1.7）。
        # 规则（正式版可以与同核心版本的 beta 同号）：
        #   - 重发已发布过的 versionName（tag 已存在）：code 不得低于当时发布的号；
        #   - 新版本（tag 不存在）：code 必须严格大于上一个正式版 —— 正式版之间要真正往前推，
        #     dev 的预览包也必须盖得过线上正式版，忘了递增就在这里红；
        #   - 最近预览版与本次同核心版本时：code 不得低于它（正式版可与它同号，不能更低）；
        #     预览版核心号不同（更旧或更新）只打印不拦 —— 老版本的 main 重发不该被新预览卡住。
        # 正式版的 code 从 tag 里读（离线、判定稳）；预览版的 code 只在公开清单里，
        # 拿不到清单时只警告，不因 OSS 抖动红掉构建。
        env:
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          OSS_PUBLIC_BASE: ${{ secrets.OSS_PUBLIC_BASE }}
        run: |
          set -euo pipefail
          case "${VERSION_CODE:-}" in
            ''|*[!0-9]*) echo "::error::versionCode 解析失败: '${VERSION_CODE:-}'"; exit 1 ;;
          esac
          # 上一个正式版：按创建时间取最新非预发布 tag（与 dev 的核心版本校验同一套口径）
          STABLE_TAG=$(git tag -l 'v*' --sort=-creatordate | { grep -vE -- '-(beta|alpha|rc)\.' || true; } | head -1)
          STABLE_NAME=""
          STABLE_CODE=0
          if [ -n "$STABLE_TAG" ]; then
            STABLE_NAME="${STABLE_TAG#v}"
            STABLE_CODE=$(git show "${STABLE_TAG}:app/build.gradle.kts" | grep -m1 "versionCode" | sed -E "s/.*=[[:space:]]*([0-9]+).*/\1/")
            case "${STABLE_CODE:-}" in
              ''|*[!0-9]*) echo "::error::读不出 $STABLE_TAG 的 versionCode"; exit 1 ;;
            esac
          fi
          PREVIEW_NAME=""
          PREVIEW_CODE=0
          PREVIEW_LABEL="未校验"
          PREVIEW_OK=0
          # preview.json 是对外公开的：先走 secrets 里的公网直链，取不到再退到客户端用的同一个域名。
          # 都失败时把 curl 原文打出来，别让它静默。
          rm -f /tmp/preview.json /tmp/curl_err.txt
          for url in "${OSS_PUBLIC_BASE:+${OSS_PUBLIC_BASE%/}/preview.json}" \
                     "https://dzhz.zyxf.top/xjtu-toolbox/preview.json"; do
            [ -n "$url" ] || continue
            if curl -fsSL --max-time 20 --retry 2 -o /tmp/preview.json "$url" 2>/tmp/curl_err.txt; then
              echo "preview 清单来自 $url"
              VALUES=$(python3 -c 'import json; m = json.load(open("/tmp/preview.json", encoding="utf-8")); print(str(m.get("versionName") or "-"), int(m.get("versionCode") or 0))' 2>/tmp/curl_err.txt || true)
              if [ -n "$VALUES" ]; then
                read -r PREVIEW_NAME PREVIEW_CODE <<<"$VALUES"
                case "${PREVIEW_CODE:-}" in
                  ''|*[!0-9]*) echo "::error::preview.json 里的 versionCode 不合法"; exit 1 ;;
                esac
                PREVIEW_LABEL="$PREVIEW_CODE"
                PREVIEW_OK=1
                break
              fi
              echo "::warning::$url 不是合法的预览清单：$(tr '\n' ' ' < /tmp/curl_err.txt)"
            else
              echo "::warning::取不到 $url：$(tr '\n' ' ' < /tmp/curl_err.txt)"
            fi
          done
          if [ "$PREVIEW_OK" != "1" ]; then
            # dev 推送不因 CDN 抖动红掉；正式发布则必须能校验「不低于同核心版本的 beta」
            if [ "${GITHUB_REF:-}" = "refs/heads/main" ]; then
              echo "::error::正式发布前读不到 preview.json，无法校验同核心版本 beta 的 versionCode；稍后重跑一次"
              exit 1
            fi
            echo "::warning::没有可用的 preview.json，本次跳过「不低于最近预览版」的比对"
          fi
          CORE_CURRENT="${VERSION%%-*}"
          CORE_PREVIEW="${PREVIEW_NAME%%-*}"
          echo "current=$VERSION ($VERSION_CODE) | stable=$STABLE_NAME ($STABLE_CODE) | preview=$PREVIEW_NAME ($PREVIEW_LABEL)"
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            # 重发同一个 versionName（main 重跑）：不低于当初发布的号即可
            REPUBLISH_CODE=$(git show "v${VERSION}:app/build.gradle.kts" | grep -m1 "versionCode" | sed -E "s/.*=[[:space:]]*([0-9]+).*/\1/")
            case "${REPUBLISH_CODE:-}" in
              ''|*[!0-9]*) echo "::error::读不出 v${VERSION} 的 versionCode"; exit 1 ;;
            esac
            echo "重发 $VERSION：该 tag 当初的 versionCode=$REPUBLISH_CODE"
            if [ "$VERSION_CODE" -lt "$REPUBLISH_CODE" ]; then
              echo "::error::重发 $VERSION 的 versionCode $VERSION_CODE 低于已发布的 $REPUBLISH_CODE，用户不会收到这个包"
              exit 1
            fi
          elif [ "$VERSION_CODE" -le "$STABLE_CODE" ]; then
            # 新版本（正式发布或 dev 预览）要严格越过上一个正式版
            echo "::error::versionCode $VERSION_CODE 必须大于上一个正式版 $STABLE_NAME 的 $STABLE_CODE；请在 app/build.gradle.kts 递增 versionCode"
            exit 1
          fi
          # 同核心版本的 beta：正式版可以与它同号，但不能更低
          if [ -n "$PREVIEW_NAME" ] && [ "$CORE_PREVIEW" = "$CORE_CURRENT" ] && [ "$VERSION_CODE" -lt "$PREVIEW_CODE" ]; then
            echo "::error::versionCode $VERSION_CODE 低于同核心版本已发布的预览版 $PREVIEW_NAME 的 $PREVIEW_CODE，预览用户装不上这次正式版；请递增 versionCode"
            exit 1
          fi
          echo "versionCode ok"

      - name: Decode Keystore
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE }}
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
        run: |
          python3 -c "
          import base64, os
          data = base64.b64decode(os.environ['KEYSTORE_B64'])
          open(os.environ['KEYSTORE_PATH'], 'wb').write(data)
          print(f'Keystore decoded: {len(data)} bytes')
          "

      - name: Unit tests + Build Release APK
        # 单测直接跑在要发布的 release 变体上，和 assembleRelease 共用同一份编译产物：
        # 以前是 debug 跑一遍测试、release 再编一遍（AGP 9 默认只为 debug 建单测任务，
        # 这条属性把 release/preview 的单测任务也建出来，本地开发者的习惯不受影响）。
        if: github.ref == 'refs/heads/main'
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          # 与仓库根目录 feedback.properties 对应；未配置时反馈页只有 GitHub 外链
          FEEDBACK_APP_ID: ${{ secrets.FEEDBACK_APP_ID }}
          FEEDBACK_APP_SECRET: ${{ secrets.FEEDBACK_APP_SECRET }}
          FEEDBACK_BASE_TOKEN: ${{ secrets.FEEDBACK_BASE_TOKEN }}
          FEEDBACK_TABLE_SUBMIT: ${{ secrets.FEEDBACK_TABLE_SUBMIT }}
          FEEDBACK_TABLE_REPLY: ${{ secrets.FEEDBACK_TABLE_REPLY }}
        run: >-
          ./gradlew :app:testReleaseUnitTest :app:assembleRelease
          -Pandroid.onlyEnableUnitTestForTheTestedBuildType=false

      - name: Verify release APK is signed
        if: github.ref == 'refs/heads/main'
        run: |
          # 未配签名时产物名是 app-release-unsigned.apk
          test -f app/build/outputs/apk/release/app-release.apk             || { echo "::error::app-release.apk 不存在——签名配置未生效，请检查 keystore secrets"; ls -la app/build/outputs/apk/release/ || true; exit 1; }

      - name: Upload artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk

      # 崩溃上报回来的堆栈是 R8 混淆过的，要靠这份 mapping 用 retrace 还原。
      # 同一个 versionName 可能重新发包（mapping 随之变），所以按 run id 区分。
      - name: Upload R8 mapping
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: mapping-${{ steps.version.outputs.version }}-run${{ github.run_id }}
          path: app/build/outputs/mapping/release/mapping.txt
          retention-days: 90

      - name: Generate release notes from AppChangelog.kt
        if: github.ref == 'refs/heads/main'
        id: notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - <<'PY' > /tmp/release_body.md
          import re, sys, os
          ver = os.environ["VERSION"]
          src = open('app/src/main/java/com/xjtu/toolbox/update/AppChangelog.kt', encoding='utf-8').read()
          # 匹配 "X.Y.Z" to VersionChangelog( ... ),
          pattern = rf'"{re.escape(ver)}"\s*to\s*VersionChangelog\((.*?)\n\s*\)\s*,?\s*(?:"|//|$)'
          m = re.search(pattern, src, re.S)
          if not m:
              # 兜底：版本号是 ENTRIES 第一个元素时后面没逗号
              pattern2 = rf'"{re.escape(ver)}"\s*to\s*VersionChangelog\((.*?)\n\s*\)'
              m = re.search(pattern2, src, re.S)
          if not m:
              print(f"## 岱宗盒子 v{ver}\n\n本次更新见应用内「设置 → 关于 → 更新日志」。")
              sys.exit(0)
          block = m.group(1)
          # 提取 items: "emoji" to "text"
          items_match = re.search(r'items\s*=\s*listOf\((.*?)\)\s*(?:,\s*issues|\)|$)', block, re.S)
          items = []
          if items_match:
              items = re.findall(r'"([^"]+)"\s*to\s*"([^"]+)"', items_match.group(1))
          # 提取 issues
          issues = []
          issues_match = re.search(r'issues\s*=\s*listOf\((.*?)\)', block, re.S)
          if issues_match:
              issues = re.findall(r'"([^"]+)"', issues_match.group(1))

          out = [f"## 岱宗盒子 v{ver}", ""]
          if items:
              out.append("### 更新内容")
              out.append("")
              for emoji, text in items:
                  out.append(f"- {emoji} {text}")
              out.append("")
          if issues:
              out.append("### 已知问题")
              out.append("")
              for i in issues:
                  out.append(f"- {i}")
              out.append("")
          out.append("---")
          out.append("APK 已附在本 Release，可直接下载安装。")
          print("\n".join(out))
          PY
          echo "Generated release notes:"
          cat /tmp/release_body.md
          # 转义成单行 JSON 字符串，经 job output 交给 gitee job 建 Release
          echo "body_json=$(python3 -c "import json; print(json.dumps(open('/tmp/release_body.md', encoding='utf-8').read()))")" >> "$GITHUB_OUTPUT"

      - name: Install OSS SDK
        id: oss_sdk
        if: github.ref == 'refs/heads/main' || env.PUBLISH_PREVIEW == 'true'
        continue-on-error: true
        timeout-minutes: 3
        run: python3 -m pip install --quiet --disable-pip-version-check --timeout 30 --retries 3 --upgrade oss2

      - name: Publish stable to OSS (primary)
        id: oss_publish
        if: github.ref == 'refs/heads/main' && steps.oss_sdk.outcome == 'success'
        continue-on-error: true
        # 平时十几秒；OSS 偶尔卡住不报错（6.2.0 首发卡了 12 分钟），超时就交给后面的「Fail if OSS…」判红，Release 照发
        timeout-minutes: 8
        env:
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          OSS_PUBLIC_BASE: ${{ secrets.OSS_PUBLIC_BASE }}
          GITHUB_REPO: yeliqin666/xjtu-toolbox-android
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          APK_KEY="xjtu-toolbox/apk/$VERSION/app-release.apk"
          echo "Uploading APK to OSS: $APK_KEY"
          python3 .github/scripts/oss_upload.py "$APK" "$APK_KEY"

          # 固定别名的「最新正式包」，给官网/文档一条不随版本变化的直链：
          #   $OSS_PUBLIC_BASE/apk/latest/app-release.apk
          # no-cache 让 CDN 每次回源校验，否则发版后仍可能下发上一版安装包。
          LATEST_KEY="xjtu-toolbox/apk/latest/app-release.apk"
          echo "Uploading APK to OSS (fixed alias): $LATEST_KEY"
          python3 .github/scripts/oss_upload.py "$APK" "$LATEST_KEY" "no-cache"

          python3 - <<'PY'
          import datetime
          import hashlib
          import json
          import os

          version = os.environ["VERSION"]
          base = os.environ["OSS_PUBLIC_BASE"].rstrip("/")
          repo = os.environ["GITHUB_REPO"]
          apk = "app/build/outputs/apk/release/app-release.apk"
          notes = open("/tmp/release_body.md", encoding="utf-8").read()
          manifest = {
              "schema": 1,
              "channel": "stable",
              "versionName": version,
              "versionCode": int(os.environ["VERSION_CODE"]),
              "apkUrl": f"{base}/apk/{version}/app-release.apk",
              "mirrors": [
                  f"https://github.com/{repo}/releases/download/v{version}/app-release.apk",
                  f"https://gitee.com/{repo}/releases/download/v{version}/app-release.apk",
              ],
              "sha256": hashlib.sha256(open(apk, "rb").read()).hexdigest(),
              "size": os.path.getsize(apk),
              "notes": notes,
              "releaseUrl": f"https://github.com/{repo}/releases/tag/v{version}",
              "publishedAt": datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
              "rollout": 100,
          }
          with open("/tmp/stable.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, ensure_ascii=False, indent=2)
          PY

          echo "Uploading manifest last: stable.json"
          python3 .github/scripts/oss_upload.py /tmp/stable.json "xjtu-toolbox/stable.json" "no-cache"
          python3 .github/scripts/oss_upload.py /tmp/stable.json "xjtu-toolbox/history/stable-$VERSION.json"

          echo "Verifying OSS manifest and APK via SDK"
          python3 - <<'PY'
          import json
          import os
          import oss2

          endpoint = os.environ["OSS_ENDPOINT"]
          if not endpoint.startswith(("http://", "https://")):
              endpoint = "https://" + endpoint
          bucket = oss2.Bucket(
              oss2.Auth(os.environ["OSS_ACCESS_KEY_ID"], os.environ["OSS_ACCESS_KEY_SECRET"]),
              endpoint,
              os.environ["OSS_BUCKET"],
          )
          version = os.environ["VERSION"]
          local = json.load(open("/tmp/stable.json", encoding="utf-8"))
          remote = json.loads(bucket.get_object("xjtu-toolbox/stable.json").read())
          assert remote["versionName"] == version, remote
          assert remote["sha256"] == local["sha256"], remote
          assert len(remote["sha256"]) == 64, remote
          head = bucket.head_object(f"xjtu-toolbox/apk/{version}/app-release.apk")
          assert head.content_length == local["size"], (head.content_length, local["size"])
          latest = bucket.head_object("xjtu-toolbox/apk/latest/app-release.apk")
          assert latest.content_length == local["size"], (latest.content_length, local["size"])
          alias_headers = getattr(latest, "headers", None) or {}
          cache_control = {k.lower(): v for k, v in alias_headers.items()}.get("cache-control", "")
          if cache_control != "no-cache":
              print(f"::warning::latest alias Cache-Control is {cache_control!r}, expected 'no-cache'")
          print("manifest/APK ok:", remote["versionName"], remote["sha256"], remote["size"])
          PY
          # 不再从 runner 抽查公网 CDN：跨境访问几乎每次超时，SDK 校验已证明对象就位
          echo "OSS primary publish verified"

      # 学期总结「关于岱宗盒子」那几页的线上数据；App 读不到就用源码里的快照。失败不影响发版。
      - name: Publish project story to OSS
        if: github.ref == 'refs/heads/main' && steps.oss_sdk.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
        run: |
          python3 .github/scripts/project_story.py /tmp/project_story.json
          python3 .github/scripts/oss_upload.py /tmp/project_story.json "xjtu-toolbox/project_story.json" "no-cache"

      # ESA 不认源站缓存头：清单已改成「不缓存」，但安装包走 30 天缓存。latest 别名会被覆盖写，
      # 重跑同一版本时版本目录里的 APK 也会被重新构建（字节不同），所以两处都要主动刷新（#519）；
      # 没配 ESA_* secrets 就跳过
      - name: Purge ESA cache for stable
        if: github.ref == 'refs/heads/main' && steps.oss_publish.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ESA_SITE_ID: ${{ secrets.ESA_SITE_ID }}
          ESA_ACCESS_KEY_ID: ${{ secrets.ESA_ACCESS_KEY_ID }}
          ESA_ACCESS_KEY_SECRET: ${{ secrets.ESA_ACCESS_KEY_SECRET }}
        run: |
          if [ -n "$ESA_SITE_ID" ]; then
            python3 -m pip install --quiet --disable-pip-version-check --timeout 30 --retries 3 alibabacloud_esa20240910 \
              || { echo "::warning::装不上 ESA SDK，跳过缓存刷新"; exit 0; }
          fi
          python3 .github/scripts/esa_purge.py "apk/$VERSION/app-release.apk" apk/latest/app-release.apk

      - name: Delete existing tag (if any)
        if: github.ref == 'refs/heads/main'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git tag -d "$TAG" 2>/dev/null || true
          git push origin ":refs/tags/$TAG" 2>/dev/null || true

      - name: Create GitHub Release
        id: gh_release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
          make_latest: true
          prerelease: ${{ contains(steps.version.outputs.version, 'alpha') || contains(steps.version.outputs.version, 'beta') }}

      # ── dev 专属步骤：构建预览包并发布 GitHub Pre-release ──
      # 默认发布；head commit 带 [skip preview] 时只做校验，不构建、不发布。
      # 手动触发时由 publish_preview 输入控制。
      - name: Decide preview publication
        if: github.ref == 'refs/heads/dev'
        run: |
          echo "publish_preview=$PUBLISH_PREVIEW"
          if [ "$PUBLISH_PREVIEW" != "true" ]; then
            echo "::notice::本次跳过预览发布（[skip preview]）；改动会在下一次发布预览时进入 beta"
          fi

      - name: Validate dev version and compute preview version
        if: github.ref == 'refs/heads/dev'
        id: preview
        env:
          BASE: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # dev 上的 versionName 不能已带后缀
          case "$BASE" in *-*) echo "::error::dev 的 versionName 不应带后缀: $BASE"; exit 1;; esac
          # 防呆：dev 的核心版本号必须严格大于最新正式 tag。正式版发布后忘记在 dev
          # 上升号时，下一次预览构建会在这里失败，避免发出号码不大于正式版的预览包。
          # 按创建时间取最新正式 tag，不能按版本号排序：仓库里有 v4.71 这类旧写法（=4.7.1），
          # sort -V 会把它排在 4.9.x 前面；同时排除 beta/alpha/rc 等预发布 tag。
          LATEST=$(git tag -l 'v*' --sort=-creatordate | { grep -vE -- '-(beta|alpha|rc)\.' || true; } | head -1 | sed 's/^v//')
          if [ -n "$LATEST" ] && [ "$(printf '%s\n%s\n' "$LATEST" "$BASE" | sort -V | tail -1)" = "$LATEST" ]; then
            echo "::error::dev 的 versionName ($BASE) 必须大于最新正式版 ($LATEST)，请在 dev 上升版本号"
            exit 1
          fi
          # 防呆：AppChangelog 启动时 require 当前版本（预览版按 X.Y.Z 匹配）有条目，
          # 缺了的话构建照样成功，但每个装上预览版的人一打开就崩。
          if ! grep -qE "\"${BASE//./\\.}\"[[:space:]]*to[[:space:]]*VersionChangelog" app/src/main/java/com/xjtu/toolbox/update/AppChangelog.kt; then
            echo "::error::AppChangelog.kt 缺少 \"$BASE\" 条目，预览包会启动即崩。升版本号时请同时在 ENTRIES 顶部加一个条目（可先占位）"
            exit 1
          fi
          # 两种方式都发预览号：release 方式只是换变体构建，版本号照样补 -beta.N。
          if [ "$PREVIEW_RELEASE_BUILD" = "true" ]; then
            VARIANT="release"
          else
            VARIANT="preview"
          fi
          # ── beta 序号 N：同一核心版本内从 1 开始递增 ──
          # 以 GitHub 上已发布的 pre-release 为准（tag 形如 vX.Y.Z-beta.N）：取最大 N + 1。
          # 用「已发布的号」而不是 CI 计数器，跳过发布的推送没有 release 也就不占号；
          # 同一个 run 重跑时按提交 SHA 找回上次已发布的号 —— 重跑是重发同一个 beta，
          # 不该凭空多占一个序号（发布步骤会更新同名 tag 的 pre-release）。
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[] | select(.prerelease) | {tag: .tag_name, body: (.body // "")}' > /tmp/preview_releases.jsonl
          python3 - <<'PY' > /tmp/beta.txt
          import json, os, re
          base = re.escape(os.environ["BASE"])
          sha = os.environ["GITHUB_SHA"]
          pattern = re.compile(r"^v" + base + r"-beta\.(\d+)$")
          best = 0
          reuse = 0
          for line in open("/tmp/preview_releases.jsonl", encoding="utf-8"):
              line = line.strip()
              if not line:
                  continue
              release = json.loads(line)
              match = pattern.match(release["tag"])
              if not match:
                  continue
              number = int(match.group(1))
              best = max(best, number)
              if sha and sha in release["body"]:
                  reuse = max(reuse, number)
          print(reuse if reuse else best + 1, "reuse" if reuse else "new")
          PY
          read -r BETA BETA_MODE < /tmp/beta.txt
          case "$BETA" in ''|*[!0-9]*) echo "::error::算不出 beta 序号: $BETA"; exit 1;; esac
          VER="${BASE}-beta.${BETA}"
          echo "variant=$VARIANT" >> $GITHUB_OUTPUT
          echo "beta=$BETA" >> $GITHUB_OUTPUT
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "tag=v${VER}" >> $GITHUB_OUTPUT
          if [ "$BETA_MODE" = "reuse" ]; then
            echo "::notice::同一提交重跑，沿用已发布的 $VER"
          else
            echo "::notice::本次预览版本 $VER"
          fi

      - name: Unit tests + preview lint + Build Preview APK
        # 三步合成一次 Gradle 调用：单测 / lint / 打包共用同一份编译产物，
        # lint 还能和 R8、打包并行；[skip preview] 时只跑测试和 lint。
        # 默认用 preview 变体（initWith(release)，proguardFiles / minify / shrinkResources
        # 与正式版同一套）；勾了 release_preview 时改用正式变体，命令与 main 上完全一致。
        if: github.ref == 'refs/heads/dev'
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          FEEDBACK_APP_ID: ${{ secrets.FEEDBACK_APP_ID }}
          FEEDBACK_APP_SECRET: ${{ secrets.FEEDBACK_APP_SECRET }}
          FEEDBACK_BASE_TOKEN: ${{ secrets.FEEDBACK_BASE_TOKEN }}
          FEEDBACK_TABLE_SUBMIT: ${{ secrets.FEEDBACK_TABLE_SUBMIT }}
          FEEDBACK_TABLE_REPLY: ${{ secrets.FEEDBACK_TABLE_REPLY }}
          # 本次算出的 beta 序号，作为 -PpreviewSuffix 传给 Gradle（两条路都用它）
          BETA: ${{ steps.preview.outputs.beta }}
        run: |
          # 两条路都带同一个预览后缀 -PpreviewSuffix=beta.N：
          # - preview 变体（日常预览）直接把它拼在 versionName 后面；
          # - release 变体（release_preview 的真机检查）也靠它把 6.0.1 补成 6.0.1-beta.N，
          #   仍低于同号正式版，main 上的正式发布不传这个参数。
          EXTRA="-PpreviewSuffix=beta.${BETA}"
          if [ "$PREVIEW_RELEASE_BUILD" = "true" ]; then
            TASKS=":app:testReleaseUnitTest :app:lintVitalRelease"
            if [ "$PUBLISH_PREVIEW" = "true" ]; then TASKS="$TASKS :app:assembleRelease"; fi
          else
            TASKS=":app:testPreviewUnitTest :app:lintVitalPreview"
            if [ "$PUBLISH_PREVIEW" = "true" ]; then TASKS="$TASKS :app:assemblePreview"; fi
          fi
          echo "Gradle tasks: $TASKS $EXTRA"
          ./gradlew $TASKS $EXTRA -Pandroid.onlyEnableUnitTestForTheTestedBuildType=false

      - name: Verify preview APK
        if: env.PUBLISH_PREVIEW == 'true'
        env:
          VERSION: ${{ steps.preview.outputs.version }}
          VARIANT: ${{ steps.preview.outputs.variant }}
        run: |
          APK=app/build/outputs/apk/$VARIANT/app-$VARIANT.apk
          test -f "$APK" || { echo "::error::app-$VARIANT.apk 不存在"; ls -la app/build/outputs/apk/$VARIANT/ || true; exit 1; }
          # 必须是正式签名（未签名时文件名会带 -unsigned，上面已拦）
          BT=$ANDROID_HOME/build-tools/37.0.0
          $BT/aapt dump badging "$APK" | grep -E "package:|application-debuggable" || true
          if $BT/aapt dump badging "$APK" | grep -q application-debuggable; then
            echo "::error::预览包不应是 debuggable"; exit 1
          fi
          $BT/aapt dump badging "$APK" | grep -q "versionName='$VERSION'" \
            || { echo "::error::APK 内 versionName 与预期 $VERSION 不一致"; exit 1; }
          cp "$APK" "xjtu-toolbox-$VERSION.apk"
          # 预览版与正式版同一套 R8 规则，堆栈已混淆，mapping 必须随构建留档供 retrace
          test -f app/build/outputs/mapping/$VARIANT/mapping.txt \
            || { echo "::error::$VARIANT mapping.txt 缺失，崩溃堆栈无法 retrace"; exit 1; }

      - name: Upload preview R8 mapping
        if: env.PUBLISH_PREVIEW == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mapping-preview-${{ steps.preview.outputs.version }}
          path: app/build/outputs/mapping/${{ steps.preview.outputs.variant }}/mapping.txt
          retention-days: 90

      - name: Publish preview to OSS (primary)
        id: oss_preview_publish
        if: env.PUBLISH_PREVIEW == 'true' && steps.oss_sdk.outcome == 'success'
        continue-on-error: true
        env:
          VERSION: ${{ steps.preview.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          # 预览版已改为全量推送：rollout 固定 100，保留字段只为兼容旧客户端。
          TAG: ${{ steps.preview.outputs.tag }}
          COMMIT_SHA: ${{ github.sha }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          OSS_PUBLIC_BASE: ${{ secrets.OSS_PUBLIC_BASE }}
          GITHUB_REPO: yeliqin666/xjtu-toolbox-android
        run: |
          set -euo pipefail
          APK="xjtu-toolbox-$VERSION.apk"
          test -f "$APK"
          APK_KEY="xjtu-toolbox/apk/preview/$VERSION/app-preview.apk"
          echo "Uploading preview APK to OSS: $APK_KEY"
          python3 .github/scripts/oss_upload.py "$APK" "$APK_KEY"

          python3 - <<'PY'
          import datetime
          import hashlib
          import json
          import os

          version = os.environ["VERSION"]
          base = os.environ["OSS_PUBLIC_BASE"].rstrip("/")
          repo = os.environ["GITHUB_REPO"]
          tag = os.environ["TAG"]
          apk = f"xjtu-toolbox-{version}.apk"
          manifest = {
              "schema": 1,
              "channel": "preview",
              "versionName": version,
              "versionCode": int(os.environ["VERSION_CODE"]),
              "apkUrl": f"{base}/apk/preview/{version}/app-preview.apk",
              "mirrors": [
                  f"https://github.com/{repo}/releases/download/{tag}/xjtu-toolbox-{version}.apk",
              ],
              "sha256": hashlib.sha256(open(apk, "rb").read()).hexdigest(),
              "size": os.path.getsize(apk),
              "notes": f"预览版 {version}（提交 {os.environ['COMMIT_SHA']}）\n\n这是尚在测试的版本，仅推送给在设置中开启「接收预览版更新」的用户。",
              "releaseUrl": f"https://github.com/{repo}/releases/tag/{tag}",
              "publishedAt": datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
              "rollout": 100,
          }
          with open("/tmp/preview.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, ensure_ascii=False, indent=2)
          PY

          echo "Uploading manifest last: preview.json"
          python3 .github/scripts/oss_upload.py /tmp/preview.json "xjtu-toolbox/preview.json" "no-cache"

          echo "Verifying OSS preview manifest and APK via SDK"
          python3 - <<'PY'
          import json
          import os
          import oss2

          endpoint = os.environ["OSS_ENDPOINT"]
          if not endpoint.startswith(("http://", "https://")):
              endpoint = "https://" + endpoint
          bucket = oss2.Bucket(
              oss2.Auth(os.environ["OSS_ACCESS_KEY_ID"], os.environ["OSS_ACCESS_KEY_SECRET"]),
              endpoint,
              os.environ["OSS_BUCKET"],
          )
          version = os.environ["VERSION"]
          local = json.load(open("/tmp/preview.json", encoding="utf-8"))
          remote = json.loads(bucket.get_object("xjtu-toolbox/preview.json").read())
          assert remote["versionName"] == version, remote
          assert remote["sha256"] == local["sha256"], remote
          assert len(remote["sha256"]) == 64, remote
          head = bucket.head_object(f"xjtu-toolbox/apk/preview/{version}/app-preview.apk")
          assert head.content_length == local["size"], (head.content_length, local["size"])
          print("preview manifest/APK ok:", remote["versionName"], remote["sha256"], remote["size"])
          PY
          echo "OSS preview publish verified"

      # 重跑同一版本会重新构建出字节不同的 APK：版本目录里的旧包若已被边缘缓存，清单里的
      # sha256 就对不上，客户端会报「安装包 SHA-256 校验失败」。清单本身不缓存，只需刷这个 APK。
      - name: Purge ESA cache for preview APK
        if: env.PUBLISH_PREVIEW == 'true' && steps.oss_preview_publish.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        env:
          VERSION: ${{ steps.preview.outputs.version }}
          ESA_SITE_ID: ${{ secrets.ESA_SITE_ID }}
          ESA_ACCESS_KEY_ID: ${{ secrets.ESA_ACCESS_KEY_ID }}
          ESA_ACCESS_KEY_SECRET: ${{ secrets.ESA_ACCESS_KEY_SECRET }}
        run: |
          if [ -n "$ESA_SITE_ID" ]; then
            python3 -m pip install --quiet --disable-pip-version-check --timeout 30 --retries 3 alibabacloud_esa20240910 \
              || { echo "::warning::装不上 ESA SDK，跳过缓存刷新"; exit 0; }
          fi
          python3 .github/scripts/esa_purge.py "apk/preview/$VERSION/app-preview.apk"

      - name: Create GitHub Pre-release
        if: env.PUBLISH_PREVIEW == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.preview.outputs.tag }}
          target_commitish: ${{ github.sha }}
          # 客户端从 name 读完整版本号（tag 是 v6.0.1-beta.N，name 是 6.0.1-beta.N）
          name: ${{ steps.preview.outputs.version }}
          prerelease: true
          make_latest: false
          body: |
            预览版 ${{ steps.preview.outputs.version }}（提交 ${{ github.sha }}）

            这是尚在测试的版本，仅推送给在设置中开启「接收预览版更新」的用户。

            ${{ steps.preview.outputs.variant == 'release' && '本包按正式版的方式构建（R8、正式签名，版本号仍带 -beta），用于发版前的真机检查，不是正式版。' || '' }}

            rollout: 100
          files: xjtu-toolbox-${{ steps.preview.outputs.version }}.apk

      - name: Prune old previews
        if: env.PUBLISH_PREVIEW == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 只保留最近 5 个预览版，连同 tag 一起删。
          # 新的预览 tag 形如 v6.0.1-beta.N；旧的 dev-<run> 也一并纳入，迁移期间的遗留由这里收掉。
          gh release list --limit 100 --json tagName,isPrerelease,createdAt \
            --jq '[.[] | select(.isPrerelease) | select((.tagName|startswith("dev-")) or (.tagName|test("-beta\\.[0-9]+$")))] | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' \
          | while read -r t; do
              echo "delete $t"; gh release delete "$t" --yes --cleanup-tag || true
            done

      - name: Prune old OSS previews
        # 预览 APK 按版本号分目录，与 GitHub 保留数对齐只留最近 5 个；
        # 删除后留下的历史版本交给 bucket 生命周期规则清。
        if: env.PUBLISH_PREVIEW == 'true' && steps.oss_sdk.outcome == 'success'
        continue-on-error: true
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
        run: python3 .github/scripts/oss_prune_previews.py --keep 5

      - name: Fail if OSS stable publish failed
        if: github.ref == 'refs/heads/main' && steps.oss_publish.outcome != 'success'
        run: |
          echo "::error::OSS primary publish failed; GitHub/Gitee fallback was published. Re-run the workflow to fix OSS."
          exit 1

      - name: Fail if OSS preview publish failed
        if: env.PUBLISH_PREVIEW == 'true' && steps.oss_preview_publish.outcome != 'success'
        run: |
          echo "::error::OSS preview publish failed; GitHub pre-release fallback was published. Re-run the workflow to fix OSS."
          exit 1

  # ── 正式版的桌面两端：安卓 Release 发出后再出包，挂到同一个 Release，不上 OSS ──
  # 用 always() 是为了 OSS 失败（build 最后一步判红）时 Release 已在，桌面包照样补上。
  desktop-linux:
    needs: build
    if: always() && github.ref == 'refs/heads/main' && needs.build.outputs.released == 'success'
    permissions:
      contents: write
    uses: ./.github/workflows/desktop-linux.yml
    with:
      release_tag: ${{ needs.build.outputs.tag }}
    secrets: inherit

  desktop-windows:
    needs: build
    if: always() && github.ref == 'refs/heads/main' && needs.build.outputs.released == 'success'
    permissions:
      contents: write
    uses: ./.github/workflows/desktop-windows.yml
    with:
      release_tag: ${{ needs.build.outputs.tag }}
    secrets: inherit

  # ── 正式版同步到 Gitee（代码、tag、Release 与 APK）──
  # 单独一个 job、和桌面两端并行：往 Gitee 传 APK 要好几分钟，放在 build 里会拖住桌面端出包。
  # 失败不影响整次发版（Gitee 只是镜像与旧版本的更新源）。
  gitee:
    needs: build
    if: always() && github.ref == 'refs/heads/main' && needs.build.outputs.released == 'success'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: app-release
          path: apk

      - name: Sync to Gitee (code + tag + release)
        env:
          TAG: ${{ needs.build.outputs.tag }}
          GITEE_TOKEN: ${{ secrets.GITEE_ACCESS_TOKEN }}
          BODY_JSON: ${{ needs.build.outputs.release_body }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          : "${TAG:?Release tag is required}"
          : "${BODY_JSON:?Release body is required}"
          OWNER="yeliqin666"
          REPO="xjtu-toolbox-android"
          APK_PATH="apk/app-release.apk"

          bash .github/scripts/gitee_push.sh HEAD refs/heads/main
          # tag 由 build 里的 Release action 在远端创建，本地还没有
          git fetch -q origin "refs/tags/${TAG}:refs/tags/${TAG}" --force
          bash .github/scripts/gitee_push.sh "refs/tags/${TAG}" "refs/tags/${TAG}"

          # 删除已有的同名 Gitee release（同一版本重发时）
          OLD_ID=$(curl -s "https://gitee.com/api/v5/repos/${OWNER}/${REPO}/releases/tags/${TAG}?access_token=${GITEE_TOKEN}" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('id',''))" 2>/dev/null || echo "")
          if [ -n "$OLD_ID" ] && [ "$OLD_ID" != "None" ]; then
            curl -s -X DELETE "https://gitee.com/api/v5/repos/${OWNER}/${REPO}/releases/${OLD_ID}?access_token=${GITEE_TOKEN}" || true
            echo "Deleted old Gitee release $OLD_ID"
          fi

          # 创建 Gitee release（target_commitish 必填）
          RELEASE=$(curl -s -X POST "https://gitee.com/api/v5/repos/${OWNER}/${REPO}/releases" \
            -H "Content-Type: application/json" \
            -d "{
              \"access_token\": \"${GITEE_TOKEN}\",
              \"tag_name\": \"${TAG}\",
              \"name\": \"${TAG}\",
              \"body\": ${BODY_JSON},
              \"target_commitish\": \"main\",
              \"prerelease\": false
            }")
          RELEASE_ID=$(echo "$RELEASE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('id',''))" 2>/dev/null || echo "")
          if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "None" ]; then
            echo "::error::创建 Gitee release 失败：$RELEASE"
            exit 1
          fi
          echo "Created Gitee release $RELEASE_ID"

          # 上传 APK：最多 3 次，失败间隔 30s / 60s，单次超时 1 小时
          test -f "$APK_PATH" || { echo "::error::APK missing at $APK_PATH"; exit 1; }
          echo "Uploading $(wc -c < "$APK_PATH") bytes"
          ATTEMPT=1
          for DELAY in 0 30 60; do
            if [ "$ATTEMPT" -gt 1 ]; then
              echo "Retry $ATTEMPT/3 after ${DELAY}s"
              sleep "$DELAY"
            fi
            HTTP_CODE=$(curl --max-time 3600 -s -w "%{http_code}" -o /tmp/gitee_upload_body.txt \
              -X POST "https://gitee.com/api/v5/repos/${OWNER}/${REPO}/releases/${RELEASE_ID}/attach_files" \
              -F "access_token=${GITEE_TOKEN}" \
              -F "file=@${APK_PATH};type=application/vnd.android.package-archive") || HTTP_CODE="000"
            echo "Upload attempt $ATTEMPT HTTP $HTTP_CODE"
            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              echo "APK uploaded to Gitee release"
              exit 0
            fi
            ATTEMPT=$((ATTEMPT + 1))
          done
          echo "::error::APK upload failed after 3 attempts"
          exit 1
