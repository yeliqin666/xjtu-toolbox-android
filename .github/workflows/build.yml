name: Build & Release

on:
  push:
    branches: [ main, dev ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/dev' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Miuix main source
        run: |
          # 固定到已验证的提交，不追 main：上游自动升依赖（如 AGP 9.4.0→9.4.1）会让
          # composite build 出现两套 AGP 直接失败。升级 miuix 时连同本仓库 AGP 一起改这里。
          MIUIX_REF=63529058dc5cbbb450707547090544f33f1a66ef
          git init -q miuix-ref
          git -C miuix-ref fetch -q --depth 1 https://github.com/miuix-kotlin-multiplatform/miuix.git "$MIUIX_REF"
          git -C miuix-ref checkout -q FETCH_HEAD
          # 本仓库 AGP 跟随 miuix（9.4.0）。composite build 不允许两套 AGP。
          # compileSdk 已跟随 miuix 升到 37，下一步装 SDK 37 与之匹配。

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Android SDK 37
        # 与 app/build.gradle.kts 的 compileSdk 37 保持一致（miuix 主线要求）；
        # 同时保留 36 供 targetSdk 使用
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "platforms;android-36" "build-tools;36.0.0" --channel=3

      - name: Extract version name
        id: version
        run: |
          VERSION=$(grep "versionName" app/build.gradle.kts | head -1 | sed "s/.*\"\(.*\)\".*/\1/")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Decode Keystore
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE }}
        run: |
          python3 -c "
          import base64, os
          data = base64.b64decode(os.environ['KEYSTORE_B64'])
          open('${{ runner.temp }}/release.jks', 'wb').write(data)
          print(f'Keystore decoded: {len(data)} bytes')
          "

      - name: Build Release APK
        if: github.ref == 'refs/heads/main'
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          # 与仓库根目录 feedback.properties 对应；未配置时反馈页只有 GitHub 外链
          FEEDBACK_APP_ID: ${{ secrets.FEEDBACK_APP_ID }}
          FEEDBACK_APP_SECRET: ${{ secrets.FEEDBACK_APP_SECRET }}
          FEEDBACK_BASE_TOKEN: ${{ secrets.FEEDBACK_BASE_TOKEN }}
          FEEDBACK_TABLE_SUBMIT: ${{ secrets.FEEDBACK_TABLE_SUBMIT }}
          FEEDBACK_TABLE_REPLY: ${{ secrets.FEEDBACK_TABLE_REPLY }}
        run: ./gradlew assembleRelease

      # assembleRelease 是根任务，:app 与 :wear 都会构建。
      # :wear 已配置与 :app 相同的 signingConfig，读的是上一步同一批环境变量，
      # 因此产物是 wear-release.apk（未配签名时才会是 wear-release-unsigned.apk）。
      - name: Verify wear APK is signed
        if: github.ref == 'refs/heads/main'
        run: |
          if [ ! -f wear/build/outputs/apk/release/wear-release.apk ]; then
            echo "::error::wear-release.apk 不存在——签名配置未生效，请检查 keystore secrets"
            ls -la wear/build/outputs/apk/release/ || true
            exit 1
          fi
          echo "wear APK: $(wc -c < wear/build/outputs/apk/release/wear-release.apk) bytes"

      - name: Upload artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            wear/build/outputs/apk/release/wear-release.apk

      # 崩溃上报回来的堆栈是 R8 混淆过的，要靠这份 mapping 用 retrace 还原。
      # 同一个 versionName 可能重新发包（mapping 随之变），所以按 run id 区分。
      - name: Upload R8 mapping
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: mapping-${{ steps.version.outputs.version }}-run${{ github.run_id }}
          path: app/build/outputs/mapping/release/mapping.txt
          retention-days: 90

      - name: Delete existing tag (if any)
        if: github.ref == 'refs/heads/main'
        run: |
          git tag -d ${{ steps.version.outputs.tag }} 2>/dev/null || true
          git push origin :refs/tags/${{ steps.version.outputs.tag }} 2>/dev/null || true

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          files: |
            app/build/outputs/apk/release/app-release.apk
            wear/build/outputs/apk/release/wear-release.apk
          generate_release_notes: true
          make_latest: true
          prerelease: ${{ contains(steps.version.outputs.version, 'alpha') || contains(steps.version.outputs.version, 'beta') }}

      - name: Generate release notes from AppChangelog.kt
        if: github.ref == 'refs/heads/main'
        id: notes
        run: |
          python3 - <<'PY' > /tmp/release_body.md
          import re, sys, os
          ver = "${{ steps.version.outputs.version }}"
          src = open('app/src/main/java/com/xjtu/toolbox/util/AppChangelog.kt', encoding='utf-8').read()
          # 匹配 "X.Y.Z" to VersionChangelog( ... ),
          pattern = rf'"{re.escape(ver)}"\s*to\s*VersionChangelog\((.*?)\n\s*\)\s*,?\s*(?:"|//|$)'
          m = re.search(pattern, src, re.S)
          if not m:
              # 兜底：版本号是 ENTRIES 第一个元素时后面没逗号
              pattern2 = rf'"{re.escape(ver)}"\s*to\s*VersionChangelog\((.*?)\n\s*\)'
              m = re.search(pattern2, src, re.S)
          if not m:
              print(f"## 岱宗盒子 v{ver}\n\n本次更新见应用内「设置 → 关于 → 更新日志」。")
              sys.exit(0)
          block = m.group(1)
          # 提取 items: "emoji" to "text"
          items_match = re.search(r'items\s*=\s*listOf\((.*?)\)\s*(?:,\s*issues|\)|$)', block, re.S)
          items = []
          if items_match:
              items = re.findall(r'"([^"]+)"\s*to\s*"([^"]+)"', items_match.group(1))
          # 提取 issues
          issues = []
          issues_match = re.search(r'issues\s*=\s*listOf\((.*?)\)', block, re.S)
          if issues_match:
              issues = re.findall(r'"([^"]+)"', issues_match.group(1))

          out = [f"## 岱宗盒子 v{ver}", ""]
          if items:
              out.append("### 更新内容")
              out.append("")
              for emoji, text in items:
                  out.append(f"- {emoji} {text}")
              out.append("")
          if issues:
              out.append("### 已知问题")
              out.append("")
              for i in issues:
                  out.append(f"- {i}")
              out.append("")
          out.append("---")
          out.append("APK 已附在本 Release，可直接下载安装。")
          print("\n".join(out))
          PY
          echo "Generated release notes:"
          cat /tmp/release_body.md
          # 转义为 JSON 安全字符串供下一步使用
          python3 -c "import json; print(json.dumps(open('/tmp/release_body.md', encoding='utf-8').read()))" > /tmp/release_body.json
          echo "body_json_path=/tmp/release_body.json" >> $GITHUB_OUTPUT

      - name: Sync to Gitee (code + tag + release)
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_ACCESS_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          OWNER="yeliqin666"
          REPO="xjtu-toolbox-android"
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          WEAR_APK_PATH="wear/build/outputs/apk/release/wear-release.apk"

          # 配置 Gitee remote
          git remote add gitee "https://yeliqin666:${GITEE_TOKEN}@gitee.com/${OWNER}/${REPO}.git" 2>/dev/null || \
            git remote set-url gitee "https://yeliqin666:${GITEE_TOKEN}@gitee.com/${OWNER}/${REPO}.git"

          # 同步 main 分支
          git push gitee main:main --force
          echo "Code synced to Gitee"

          # 拉取 tag（release action 在 remote 创建了 tag，本地可能没有）
          git fetch origin --tags --force
          git push gitee "${TAG}" --force
          echo "Tag ${TAG} synced to Gitee"

          # 删除已有的同名 Gitee release
          OLD_ID=$(curl -s "https://gitee.com/api/v5/repos/${OWNER}/${REPO}/releases/tags/${TAG}?access_token=${GITEE_TOKEN}" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('id',''))" 2>/dev/null || echo "")
          if [ -n "$OLD_ID" ] && [ "$OLD_ID" != "None" ] && [ "$OLD_ID" != "" ]; then
            curl -s -X DELETE "https://gitee.com/api/v5/repos/${OWNER}/${REPO}/releases/${OLD_ID}?access_token=${GITEE_TOKEN}" || true
            echo "Deleted old Gitee release $OLD_ID"
          fi

          # 读取由上一步生成的 release body（已经是 JSON 字符串字面量，含两端引号）
          BODY_JSON=$(cat /tmp/release_body.json)

          # 创建 Gitee release（target_commitish 必填）
          RELEASE=$(curl -s -X POST "https://gitee.com/api/v5/repos/${OWNER}/${REPO}/releases" \
            -H "Content-Type: application/json" \
            -d "{
              \"access_token\": \"${GITEE_TOKEN}\",
              \"tag_name\": \"${TAG}\",
              \"name\": \"${TAG}\",
              \"body\": ${BODY_JSON},
              \"target_commitish\": \"main\",
              \"prerelease\": false
            }")
          echo "Create response: $RELEASE"
          RELEASE_ID=$(echo "$RELEASE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('id',''))" 2>/dev/null || echo "")
          if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "None" ]; then
            echo "Failed to get release ID, skipping APK upload. Response: $RELEASE"
            exit 0
          fi
          echo "Created Gitee release $RELEASE_ID"

          # 上传 APK：每个包最多 3 次，失败间隔 30s / 60s，单次超时 1 小时。
          # 手机包三次仍失败则让本步失败（外层 continue-on-error 再接手）；
          # 手表包失败只警告。
          upload_apk() {
            local APK="$1"
            local REQUIRED="$2"
            local NAME
            NAME="$(basename "$APK")"
            echo "Uploading $NAME: $(wc -c < "$APK") bytes"
            local ATTEMPT=1
            local DELAYS="0 30 60"
            for DELAY in $DELAYS; do
              if [ "$ATTEMPT" -gt 1 ]; then
                echo "Retry $ATTEMPT/3 for $NAME after ${DELAY}s"
                sleep "$DELAY"
              fi
              HTTP_CODE=$(curl --max-time 3600 --progress-bar -w "%{http_code}" -o /tmp/gitee_upload_body.txt \
                -X POST "https://gitee.com/api/v5/repos/${OWNER}/${REPO}/releases/${RELEASE_ID}/attach_files" \
                -F "access_token=${GITEE_TOKEN}" \
                -F "file=@${APK};type=application/vnd.android.package-archive") || HTTP_CODE="000"
              echo "Upload $NAME attempt $ATTEMPT HTTP $HTTP_CODE"
              if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
                echo "$NAME uploaded to Gitee release"
                return 0
              fi
              ATTEMPT=$((ATTEMPT + 1))
            done
            if [ "$REQUIRED" = "true" ]; then
              echo "::error::$NAME upload failed after 3 attempts"
              return 1
            fi
            echo "::warning::$NAME upload failed after 3 attempts, continuing"
            return 0
          }

          if [ -f "$APK_PATH" ]; then
            upload_apk "$APK_PATH" true || exit 1
          else
            echo "::error::phone APK missing at $APK_PATH"
            exit 1
          fi
          if [ -f "$WEAR_APK_PATH" ]; then
            upload_apk "$WEAR_APK_PATH" false
          else
            echo "Skip missing $WEAR_APK_PATH"
          fi

      # ── dev 专属步骤：构建预览包并发布 GitHub Pre-release ──
      - name: Compute preview version
        if: github.ref == 'refs/heads/dev'
        id: preview
        run: |
          BASE="${{ steps.version.outputs.version }}"
          # dev 上的 versionName 必须是「下一个正式版」号且不能已带后缀
          case "$BASE" in *-*) echo "::error::dev 的 versionName 不应带后缀: $BASE"; exit 1;; esac
          # 防呆：dev 版本号必须大于最新正式 tag，否则预览版比已发布正式版还"旧"，没人收得到
          # 按创建时间取最新正式 tag，不能按版本号排序：仓库里有 v4.71 这类旧写法（=4.7.1），
          # sort -V 会把它排在 4.9.x 前面。
          LATEST=$(git tag -l 'v*' --sort=-creatordate | head -1 | sed 's/^v//')
          if [ -n "$LATEST" ] && [ "$(printf '%s\n%s\n' "$LATEST" "$BASE" | sort -V | tail -1)" != "$BASE" -o "$LATEST" = "$BASE" ]; then
            echo "::error::dev 的 versionName ($BASE) 必须大于最新正式版 ($LATEST)，请先在 dev 上升版本号"
            exit 1
          fi
          # 防呆：AppChangelog 启动时 require 当前版本（预览版按 X.Y.Z 匹配）有条目，
          # 缺了的话构建照样成功，但每个装上预览版的人一打开就崩。
          if ! grep -qE "\"${BASE//./\\.}\"[[:space:]]*to[[:space:]]*VersionChangelog" app/src/main/java/com/xjtu/toolbox/util/AppChangelog.kt; then
            echo "::error::AppChangelog.kt 缺少 \"$BASE\" 条目，预览包会启动即崩。升版本号时请同时在 ENTRIES 顶部加一个条目（可先占位）"
            exit 1
          fi
          VER="${BASE}-dev.${GITHUB_RUN_NUMBER}"
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "tag=dev-${GITHUB_RUN_NUMBER}" >> $GITHUB_OUTPUT

      - name: Build Preview APK
        if: github.ref == 'refs/heads/dev'
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          FEEDBACK_APP_ID: ${{ secrets.FEEDBACK_APP_ID }}
          FEEDBACK_APP_SECRET: ${{ secrets.FEEDBACK_APP_SECRET }}
          FEEDBACK_BASE_TOKEN: ${{ secrets.FEEDBACK_BASE_TOKEN }}
          FEEDBACK_TABLE_SUBMIT: ${{ secrets.FEEDBACK_TABLE_SUBMIT }}
          FEEDBACK_TABLE_REPLY: ${{ secrets.FEEDBACK_TABLE_REPLY }}
        # 只构建 :app，:wear 没有 preview 构建类型
        run: ./gradlew :app:assemblePreview

      - name: Verify preview APK
        if: github.ref == 'refs/heads/dev'
        run: |
          APK=app/build/outputs/apk/preview/app-preview.apk
          test -f "$APK" || { echo "::error::app-preview.apk 不存在"; ls -la app/build/outputs/apk/preview/ || true; exit 1; }
          # 必须是正式签名（未签名时文件名会是 app-preview-unsigned.apk，上面已拦）
          BT=$ANDROID_HOME/build-tools/37.0.0
          $BT/aapt dump badging "$APK" | grep -E "package:|application-debuggable" || true
          if $BT/aapt dump badging "$APK" | grep -q application-debuggable; then
            echo "::error::预览包不应是 debuggable"; exit 1
          fi
          $BT/aapt dump badging "$APK" | grep -q "versionName='${{ steps.preview.outputs.version }}'" \
            || { echo "::error::APK 内 versionName 与预期 ${{ steps.preview.outputs.version }} 不一致"; exit 1; }
          cp "$APK" "xjtu-toolbox-${{ steps.preview.outputs.version }}.apk"

      - name: Create GitHub Pre-release
        if: github.ref == 'refs/heads/dev'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.preview.outputs.tag }}
          target_commitish: ${{ github.sha }}
          # 客户端从 name 读完整版本号（tag 是 dev-N，不含版本）
          name: ${{ steps.preview.outputs.version }}
          prerelease: true
          make_latest: false
          body: |
            预览版 ${{ steps.preview.outputs.version }}（提交 ${{ github.sha }}）

            这是尚在测试的版本，仅推送给在设置中开启「接收预览版更新」的用户。

            rollout: ${{ vars.PREVIEW_DEFAULT_ROLLOUT || 20 }}
          files: xjtu-toolbox-${{ steps.preview.outputs.version }}.apk

      - name: Prune old previews
        if: github.ref == 'refs/heads/dev'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 只保留最近 5 个预览版，连同 tag 一起删
          gh release list --limit 100 --json tagName,isPrerelease,createdAt \
            --jq '[.[] | select(.isPrerelease and (.tagName|startswith("dev-")))] | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' \
          | while read -r t; do
              echo "delete $t"; gh release delete "$t" --yes --cleanup-tag || true
            done
