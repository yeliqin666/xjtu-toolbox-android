name: Build & Release

on:
  push:
    branches: [ main, dev ]
  workflow_dispatch:
    inputs:
      publish_preview:
        description: "在 dev 上发布预览版（main 忽略此项）"
        type: boolean
        default: true

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/dev' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # dev 推送默认发布预览版；head commit 带 [skip preview] 时只跑检查、不发布。
      # 手动触发时用 publish_preview 输入控制，便于把之前跳过的改动补发成一个 beta。
      PUBLISH_PREVIEW: ${{ github.ref == 'refs/heads/dev' && ((github.event_name == 'workflow_dispatch' && (github.event.inputs.publish_preview == true || github.event.inputs.publish_preview == 'true')) || (github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip preview]'))) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Android SDK 37
        # 与 app/build.gradle.kts 的 compileSdk 37 保持一致（miuix AAR 要求的最低 compileSdk）；
        # 同时保留 36 供 targetSdk 使用
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "platforms;android-36" "build-tools;36.0.0" --channel=3

      - name: Unit tests
        # 单测不过就不出包
        run: ./gradlew :app:testDebugUnitTest

      - name: Verify release shrinking
        if: github.ref == 'refs/heads/dev'
        run: ./gradlew :app:minifyReleaseWithR8

      - name: Extract version name
        id: version
        run: |
          VERSION=$(grep "versionName" app/build.gradle.kts | head -1 | sed "s/.*\"\(.*\)\".*/\1/")
          VERSION_CODE=$(grep "versionCode" app/build.gradle.kts | head -1 | sed -E "s/.*=[[:space:]]*([0-9]+).*/\1/")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Decode Keystore
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE }}
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
        run: |
          python3 -c "
          import base64, os
          data = base64.b64decode(os.environ['KEYSTORE_B64'])
          open(os.environ['KEYSTORE_PATH'], 'wb').write(data)
          print(f'Keystore decoded: {len(data)} bytes')
          "

      - name: Build Release APK
        if: github.ref == 'refs/heads/main'
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          # 与仓库根目录 feedback.properties 对应；未配置时反馈页只有 GitHub 外链
          FEEDBACK_APP_ID: ${{ secrets.FEEDBACK_APP_ID }}
          FEEDBACK_APP_SECRET: ${{ secrets.FEEDBACK_APP_SECRET }}
          FEEDBACK_BASE_TOKEN: ${{ secrets.FEEDBACK_BASE_TOKEN }}
          FEEDBACK_TABLE_SUBMIT: ${{ secrets.FEEDBACK_TABLE_SUBMIT }}
          FEEDBACK_TABLE_REPLY: ${{ secrets.FEEDBACK_TABLE_REPLY }}
        run: ./gradlew :app:assembleRelease

      - name: Verify release APK is signed
        if: github.ref == 'refs/heads/main'
        run: |
          # 未配签名时产物名是 app-release-unsigned.apk
          test -f app/build/outputs/apk/release/app-release.apk             || { echo "::error::app-release.apk 不存在——签名配置未生效，请检查 keystore secrets"; ls -la app/build/outputs/apk/release/ || true; exit 1; }

      - name: Upload artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk

      # 崩溃上报回来的堆栈是 R8 混淆过的，要靠这份 mapping 用 retrace 还原。
      # 同一个 versionName 可能重新发包（mapping 随之变），所以按 run id 区分。
      - name: Upload R8 mapping
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: mapping-${{ steps.version.outputs.version }}-run${{ github.run_id }}
          path: app/build/outputs/mapping/release/mapping.txt
          retention-days: 90

      - name: Generate release notes from AppChangelog.kt
        if: github.ref == 'refs/heads/main'
        id: notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - <<'PY' > /tmp/release_body.md
          import re, sys, os
          ver = os.environ["VERSION"]
          src = open('app/src/main/java/com/xjtu/toolbox/update/AppChangelog.kt', encoding='utf-8').read()
          # 匹配 "X.Y.Z" to VersionChangelog( ... ),
          pattern = rf'"{re.escape(ver)}"\s*to\s*VersionChangelog\((.*?)\n\s*\)\s*,?\s*(?:"|//|$)'
          m = re.search(pattern, src, re.S)
          if not m:
              # 兜底：版本号是 ENTRIES 第一个元素时后面没逗号
              pattern2 = rf'"{re.escape(ver)}"\s*to\s*VersionChangelog\((.*?)\n\s*\)'
              m = re.search(pattern2, src, re.S)
          if not m:
              print(f"## 岱宗盒子 v{ver}\n\n本次更新见应用内「设置 → 关于 → 更新日志」。")
              sys.exit(0)
          block = m.group(1)
          # 提取 items: "emoji" to "text"
          items_match = re.search(r'items\s*=\s*listOf\((.*?)\)\s*(?:,\s*issues|\)|$)', block, re.S)
          items = []
          if items_match:
              items = re.findall(r'"([^"]+)"\s*to\s*"([^"]+)"', items_match.group(1))
          # 提取 issues
          issues = []
          issues_match = re.search(r'issues\s*=\s*listOf\((.*?)\)', block, re.S)
          if issues_match:
              issues = re.findall(r'"([^"]+)"', issues_match.group(1))

          out = [f"## 岱宗盒子 v{ver}", ""]
          if items:
              out.append("### 更新内容")
              out.append("")
              for emoji, text in items:
                  out.append(f"- {emoji} {text}")
              out.append("")
          if issues:
              out.append("### 已知问题")
              out.append("")
              for i in issues:
                  out.append(f"- {i}")
              out.append("")
          out.append("---")
          out.append("APK 已附在本 Release，可直接下载安装。")
          print("\n".join(out))
          PY
          echo "Generated release notes:"
          cat /tmp/release_body.md
          # 转义为 JSON 安全字符串供下一步使用
          python3 -c "import json; print(json.dumps(open('/tmp/release_body.md', encoding='utf-8').read()))" > /tmp/release_body.json
          echo "body_json_path=/tmp/release_body.json" >> $GITHUB_OUTPUT

      - name: Install OSS SDK
        id: oss_sdk
        if: github.ref == 'refs/heads/main' || env.PUBLISH_PREVIEW == 'true'
        continue-on-error: true
        timeout-minutes: 3
        run: python3 -m pip install --quiet --disable-pip-version-check --timeout 30 --retries 3 --upgrade oss2

      - name: Publish stable to OSS (primary)
        id: oss_publish
        if: github.ref == 'refs/heads/main' && steps.oss_sdk.outcome == 'success'
        continue-on-error: true
        env:
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          OSS_PUBLIC_BASE: ${{ secrets.OSS_PUBLIC_BASE }}
          GITHUB_REPO: yeliqin666/xjtu-toolbox-android
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          APK_KEY="xjtu-toolbox/apk/$VERSION/app-release.apk"
          echo "Uploading APK to OSS: $APK_KEY"
          python3 .github/scripts/oss_upload.py "$APK" "$APK_KEY"

          # 固定别名的「最新正式包」，给官网/文档一条不随版本变化的直链：
          #   $OSS_PUBLIC_BASE/apk/latest/app-release.apk
          # no-cache 让 CDN 每次回源校验，否则发版后仍可能下发上一版安装包。
          LATEST_KEY="xjtu-toolbox/apk/latest/app-release.apk"
          echo "Uploading APK to OSS (fixed alias): $LATEST_KEY"
          python3 .github/scripts/oss_upload.py "$APK" "$LATEST_KEY" "no-cache"

          python3 - <<'PY'
          import datetime
          import hashlib
          import json
          import os

          version = os.environ["VERSION"]
          base = os.environ["OSS_PUBLIC_BASE"].rstrip("/")
          repo = os.environ["GITHUB_REPO"]
          apk = "app/build/outputs/apk/release/app-release.apk"
          notes = open("/tmp/release_body.md", encoding="utf-8").read()
          manifest = {
              "schema": 1,
              "channel": "stable",
              "versionName": version,
              "versionCode": int(os.environ["VERSION_CODE"]),
              "apkUrl": f"{base}/apk/{version}/app-release.apk",
              "mirrors": [
                  f"https://github.com/{repo}/releases/download/v{version}/app-release.apk",
                  f"https://gitee.com/{repo}/releases/download/v{version}/app-release.apk",
              ],
              "sha256": hashlib.sha256(open(apk, "rb").read()).hexdigest(),
              "size": os.path.getsize(apk),
              "notes": notes,
              "releaseUrl": f"https://github.com/{repo}/releases/tag/v{version}",
              "publishedAt": datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
              "rollout": 100,
          }
          with open("/tmp/stable.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, ensure_ascii=False, indent=2)
          PY

          echo "Uploading manifest last: stable.json"
          python3 .github/scripts/oss_upload.py /tmp/stable.json "xjtu-toolbox/stable.json"
          python3 .github/scripts/oss_upload.py /tmp/stable.json "xjtu-toolbox/history/stable-$VERSION.json"

          echo "Verifying OSS manifest and APK via SDK"
          python3 - <<'PY'
          import json
          import os
          import oss2

          endpoint = os.environ["OSS_ENDPOINT"]
          if not endpoint.startswith(("http://", "https://")):
              endpoint = "https://" + endpoint
          bucket = oss2.Bucket(
              oss2.Auth(os.environ["OSS_ACCESS_KEY_ID"], os.environ["OSS_ACCESS_KEY_SECRET"]),
              endpoint,
              os.environ["OSS_BUCKET"],
          )
          version = os.environ["VERSION"]
          local = json.load(open("/tmp/stable.json", encoding="utf-8"))
          remote = json.loads(bucket.get_object("xjtu-toolbox/stable.json").read())
          assert remote["versionName"] == version, remote
          assert remote["sha256"] == local["sha256"], remote
          assert len(remote["sha256"]) == 64, remote
          head = bucket.head_object(f"xjtu-toolbox/apk/{version}/app-release.apk")
          assert head.content_length == local["size"], (head.content_length, local["size"])
          latest = bucket.head_object("xjtu-toolbox/apk/latest/app-release.apk")
          assert latest.content_length == local["size"], (latest.content_length, local["size"])
          alias_headers = getattr(latest, "headers", None) or {}
          cache_control = {k.lower(): v for k, v in alias_headers.items()}.get("cache-control", "")
          if cache_control != "no-cache":
              print(f"::warning::latest alias Cache-Control is {cache_control!r}, expected 'no-cache'")
          print("manifest/APK ok:", remote["versionName"], remote["sha256"], remote["size"])
          PY
          # 公共 CDN 只做抽样；GitHub runner 跨境访问偶发超时不应阻断发布。
          curl -fsS --max-time 20 "$OSS_PUBLIC_BASE/stable.json" >/dev/null \
            || echo "::warning::public CDN manifest check timed out; OSS objects are verified"
          # 固定别名带版本号查询串绕过 CDN 缓存，确认新包已经能被公网取到。
          curl -fsSI --max-time 20 "$OSS_PUBLIC_BASE/apk/latest/app-release.apk?v=$VERSION" >/dev/null \
            || echo "::warning::public CDN latest-apk check timed out; OSS objects are verified"
          echo "OSS primary publish verified"

      - name: Delete existing tag (if any)
        if: github.ref == 'refs/heads/main'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git tag -d "$TAG" 2>/dev/null || true
          git push origin ":refs/tags/$TAG" 2>/dev/null || true

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
          make_latest: true
          prerelease: ${{ contains(steps.version.outputs.version, 'alpha') || contains(steps.version.outputs.version, 'beta') }}

      - name: Sync to Gitee (code + tag + release)
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          TAG: ${{ steps.version.outputs.tag }}
          GITEE_TOKEN: ${{ secrets.GITEE_ACCESS_TOKEN }}
          # 拿不到凭据就直接失败，不要在无人值守的 CI 上等输入框
          GIT_TERMINAL_PROMPT: "0"
        run: |
          : "${TAG:?Release tag is required}"
          OWNER="yeliqin666"
          REPO="xjtu-toolbox-android"
          APK_PATH="app/build/outputs/apk/release/app-release.apk"

          # 配置 Gitee remote
          GITEE_URL="https://gitee.com/${OWNER}/${REPO}.git"
          # token 不拼进 remote URL：URL 会被 git 写进 .git/config，之后任何
          # `git remote -v` 或 push 报错都可能把它打出来。凭据只经 env 交给 credential
          # helper（.git/config 里存下的也只是对 $GITEE_TOKEN 的引用）。
          git remote add gitee "$GITEE_URL" 2>/dev/null || git remote set-url gitee "$GITEE_URL"
          git config --local --replace-all 'credential.https://gitee.com.helper' \
            '!f() { echo "username=yeliqin666"; echo "password=$GITEE_TOKEN"; }; f'

          # 同步 main 分支
          git push gitee main:main --force
          echo "Code synced to Gitee"

          # 拉取 tag（release action 在 remote 创建了 tag，本地可能没有）
          git fetch origin --tags --force
          git push gitee "${TAG}" --force
          echo "Tag ${TAG} synced to Gitee"

          # 删除已有的同名 Gitee release
          OLD_ID=$(curl -s "https://gitee.com/api/v5/repos/${OWNER}/${REPO}/releases/tags/${TAG}?access_token=${GITEE_TOKEN}" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('id',''))" 2>/dev/null || echo "")
          if [ -n "$OLD_ID" ] && [ "$OLD_ID" != "None" ] && [ "$OLD_ID" != "" ]; then
            curl -s -X DELETE "https://gitee.com/api/v5/repos/${OWNER}/${REPO}/releases/${OLD_ID}?access_token=${GITEE_TOKEN}" || true
            echo "Deleted old Gitee release $OLD_ID"
          fi

          # 读取由上一步生成的 release body（已经是 JSON 字符串字面量，含两端引号）
          BODY_JSON=$(cat /tmp/release_body.json)

          # 创建 Gitee release（target_commitish 必填）
          RELEASE=$(curl -s -X POST "https://gitee.com/api/v5/repos/${OWNER}/${REPO}/releases" \
            -H "Content-Type: application/json" \
            -d "{
              \"access_token\": \"${GITEE_TOKEN}\",
              \"tag_name\": \"${TAG}\",
              \"name\": \"${TAG}\",
              \"body\": ${BODY_JSON},
              \"target_commitish\": \"main\",
              \"prerelease\": false
            }")
          echo "Create response: $RELEASE"
          RELEASE_ID=$(echo "$RELEASE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('id',''))" 2>/dev/null || echo "")
          if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "None" ]; then
            echo "Failed to get release ID, skipping APK upload. Response: $RELEASE"
            exit 0
          fi
          echo "Created Gitee release $RELEASE_ID"

          # 上传 APK：最多 3 次，失败间隔 30s / 60s，单次超时 1 小时。
          # 三次仍失败则让本步失败（外层 continue-on-error 再接手）。
          upload_apk() {
            local APK="$1"
            local NAME
            NAME="$(basename "$APK")"
            echo "Uploading $NAME: $(wc -c < "$APK") bytes"
            local ATTEMPT=1
            local DELAYS="0 30 60"
            for DELAY in $DELAYS; do
              if [ "$ATTEMPT" -gt 1 ]; then
                echo "Retry $ATTEMPT/3 for $NAME after ${DELAY}s"
                sleep "$DELAY"
              fi
              HTTP_CODE=$(curl --max-time 3600 --progress-bar -w "%{http_code}" -o /tmp/gitee_upload_body.txt \
                -X POST "https://gitee.com/api/v5/repos/${OWNER}/${REPO}/releases/${RELEASE_ID}/attach_files" \
                -F "access_token=${GITEE_TOKEN}" \
                -F "file=@${APK};type=application/vnd.android.package-archive") || HTTP_CODE="000"
              echo "Upload $NAME attempt $ATTEMPT HTTP $HTTP_CODE"
              if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
                echo "$NAME uploaded to Gitee release"
                return 0
              fi
              ATTEMPT=$((ATTEMPT + 1))
            done
            echo "::error::$NAME upload failed after 3 attempts"
            return 1
          }

          if [ -f "$APK_PATH" ]; then
            upload_apk "$APK_PATH" || exit 1
          else
            echo "::error::phone APK missing at $APK_PATH"
            exit 1
          fi

      # ── dev 专属步骤：构建预览包并发布 GitHub Pre-release ──
      # 默认发布；head commit 带 [skip preview] 时只做校验，不构建、不发布。
      # 手动触发时由 publish_preview 输入控制。
      - name: Decide preview publication
        if: github.ref == 'refs/heads/dev'
        run: |
          echo "publish_preview=$PUBLISH_PREVIEW"
          if [ "$PUBLISH_PREVIEW" != "true" ]; then
            echo "::notice::本次跳过预览发布（[skip preview]）；改动会在下一次发布预览时进入 beta"
          fi

      - name: Validate dev version and compute preview version
        if: github.ref == 'refs/heads/dev'
        id: preview
        env:
          BASE: ${{ steps.version.outputs.version }}
        run: |
          # dev 上的 versionName 不能已带后缀
          case "$BASE" in *-*) echo "::error::dev 的 versionName 不应带后缀: $BASE"; exit 1;; esac
          # 防呆：dev 的核心版本号必须严格大于最新正式 tag。正式版发布后忘记在 dev
          # 上升号时，下一次预览构建会在这里失败，避免发出号码不大于正式版的预览包。
          # 按创建时间取最新正式 tag，不能按版本号排序：仓库里有 v4.71 这类旧写法（=4.7.1），
          # sort -V 会把它排在 4.9.x 前面；同时排除 beta/alpha/rc 等预发布 tag。
          LATEST=$(git tag -l 'v*' --sort=-creatordate | { grep -vE -- '-(beta|alpha|rc)\.' || true; } | head -1 | sed 's/^v//')
          if [ -n "$LATEST" ] && [ "$(printf '%s\n%s\n' "$LATEST" "$BASE" | sort -V | tail -1)" = "$LATEST" ]; then
            echo "::error::dev 的 versionName ($BASE) 必须大于最新正式版 ($LATEST)，请在 dev 上升版本号"
            exit 1
          fi
          # 防呆：AppChangelog 启动时 require 当前版本（预览版按 X.Y.Z 匹配）有条目，
          # 缺了的话构建照样成功，但每个装上预览版的人一打开就崩。
          if ! grep -qE "\"${BASE//./\\.}\"[[:space:]]*to[[:space:]]*VersionChangelog" app/src/main/java/com/xjtu/toolbox/update/AppChangelog.kt; then
            echo "::error::AppChangelog.kt 缺少 \"$BASE\" 条目，预览包会启动即崩。升版本号时请同时在 ENTRIES 顶部加一个条目（可先占位）"
            exit 1
          fi
          VER="${BASE}-dev.${GITHUB_RUN_NUMBER}"
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "tag=dev-${GITHUB_RUN_NUMBER}" >> $GITHUB_OUTPUT

      - name: Build Preview APK
        if: env.PUBLISH_PREVIEW == 'true'
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          FEEDBACK_APP_ID: ${{ secrets.FEEDBACK_APP_ID }}
          FEEDBACK_APP_SECRET: ${{ secrets.FEEDBACK_APP_SECRET }}
          FEEDBACK_BASE_TOKEN: ${{ secrets.FEEDBACK_BASE_TOKEN }}
          FEEDBACK_TABLE_SUBMIT: ${{ secrets.FEEDBACK_TABLE_SUBMIT }}
          FEEDBACK_TABLE_REPLY: ${{ secrets.FEEDBACK_TABLE_REPLY }}
        run: ./gradlew :app:assemblePreview

      - name: Verify preview APK
        if: env.PUBLISH_PREVIEW == 'true'
        env:
          VERSION: ${{ steps.preview.outputs.version }}
        run: |
          APK=app/build/outputs/apk/preview/app-preview.apk
          test -f "$APK" || { echo "::error::app-preview.apk 不存在"; ls -la app/build/outputs/apk/preview/ || true; exit 1; }
          # 必须是正式签名（未签名时文件名会是 app-preview-unsigned.apk，上面已拦）
          BT=$ANDROID_HOME/build-tools/37.0.0
          $BT/aapt dump badging "$APK" | grep -E "package:|application-debuggable" || true
          if $BT/aapt dump badging "$APK" | grep -q application-debuggable; then
            echo "::error::预览包不应是 debuggable"; exit 1
          fi
          $BT/aapt dump badging "$APK" | grep -q "versionName='$VERSION'" \
            || { echo "::error::APK 内 versionName 与预期 $VERSION 不一致"; exit 1; }
          cp "$APK" "xjtu-toolbox-$VERSION.apk"

      - name: Publish preview to OSS (primary)
        id: oss_preview_publish
        if: env.PUBLISH_PREVIEW == 'true' && steps.oss_sdk.outcome == 'success'
        continue-on-error: true
        env:
          VERSION: ${{ steps.preview.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          # 预览版已改为全量推送：rollout 固定 100，保留字段只为兼容旧客户端。
          RUN_NUMBER: ${{ github.run_number }}
          COMMIT_SHA: ${{ github.sha }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          OSS_PUBLIC_BASE: ${{ secrets.OSS_PUBLIC_BASE }}
          GITHUB_REPO: yeliqin666/xjtu-toolbox-android
        run: |
          set -euo pipefail
          APK="xjtu-toolbox-$VERSION.apk"
          test -f "$APK"
          APK_KEY="xjtu-toolbox/apk/preview/$VERSION/app-preview.apk"
          echo "Uploading preview APK to OSS: $APK_KEY"
          python3 .github/scripts/oss_upload.py "$APK" "$APK_KEY"

          python3 - <<'PY'
          import datetime
          import hashlib
          import json
          import os

          version = os.environ["VERSION"]
          base = os.environ["OSS_PUBLIC_BASE"].rstrip("/")
          repo = os.environ["GITHUB_REPO"]
          run_number = os.environ["RUN_NUMBER"]
          apk = f"xjtu-toolbox-{version}.apk"
          manifest = {
              "schema": 1,
              "channel": "preview",
              "versionName": version,
              "versionCode": int(os.environ["VERSION_CODE"]),
              "apkUrl": f"{base}/apk/preview/{version}/app-preview.apk",
              "mirrors": [
                  f"https://github.com/{repo}/releases/download/dev-{run_number}/xjtu-toolbox-{version}.apk",
              ],
              "sha256": hashlib.sha256(open(apk, "rb").read()).hexdigest(),
              "size": os.path.getsize(apk),
              "notes": f"预览版 {version}（提交 {os.environ['COMMIT_SHA']}）\n\n这是尚在测试的版本，仅推送给在设置中开启「接收预览版更新」的用户。",
              "releaseUrl": f"https://github.com/{repo}/releases/tag/dev-{run_number}",
              "publishedAt": datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
              "rollout": 100,
          }
          with open("/tmp/preview.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, ensure_ascii=False, indent=2)
          PY

          echo "Uploading manifest last: preview.json"
          python3 .github/scripts/oss_upload.py /tmp/preview.json "xjtu-toolbox/preview.json"

          echo "Verifying OSS preview manifest and APK via SDK"
          python3 - <<'PY'
          import json
          import os
          import oss2

          endpoint = os.environ["OSS_ENDPOINT"]
          if not endpoint.startswith(("http://", "https://")):
              endpoint = "https://" + endpoint
          bucket = oss2.Bucket(
              oss2.Auth(os.environ["OSS_ACCESS_KEY_ID"], os.environ["OSS_ACCESS_KEY_SECRET"]),
              endpoint,
              os.environ["OSS_BUCKET"],
          )
          version = os.environ["VERSION"]
          local = json.load(open("/tmp/preview.json", encoding="utf-8"))
          remote = json.loads(bucket.get_object("xjtu-toolbox/preview.json").read())
          assert remote["versionName"] == version, remote
          assert remote["sha256"] == local["sha256"], remote
          assert len(remote["sha256"]) == 64, remote
          head = bucket.head_object(f"xjtu-toolbox/apk/preview/{version}/app-preview.apk")
          assert head.content_length == local["size"], (head.content_length, local["size"])
          print("preview manifest/APK ok:", remote["versionName"], remote["sha256"], remote["size"])
          PY
          curl -fsS --max-time 20 "$OSS_PUBLIC_BASE/preview.json" >/dev/null \
            || echo "::warning::public CDN manifest check timed out; OSS objects are verified"
          echo "OSS preview publish verified"

      - name: Create GitHub Pre-release
        if: env.PUBLISH_PREVIEW == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.preview.outputs.tag }}
          target_commitish: ${{ github.sha }}
          # 客户端从 name 读完整版本号（tag 是 dev-N，不含版本）
          name: ${{ steps.preview.outputs.version }}
          prerelease: true
          make_latest: false
          body: |
            预览版 ${{ steps.preview.outputs.version }}（提交 ${{ github.sha }}）

            这是尚在测试的版本，仅推送给在设置中开启「接收预览版更新」的用户。

            rollout: 100
          files: xjtu-toolbox-${{ steps.preview.outputs.version }}.apk

      - name: Prune old previews
        if: env.PUBLISH_PREVIEW == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 只保留最近 5 个预览版，连同 tag 一起删
          gh release list --limit 100 --json tagName,isPrerelease,createdAt \
            --jq '[.[] | select(.isPrerelease and (.tagName|startswith("dev-")))] | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' \
          | while read -r t; do
              echo "delete $t"; gh release delete "$t" --yes --cleanup-tag || true
            done

      - name: Prune old OSS previews
        # 预览 APK 是按版本号分目录的独立 key，生命周期规则（只管同一 key 的历史版本）
        # 清不到它们。这里与上一步 GitHub 的保留数对齐，只保留最近 5 个版本目录，
        # 其余连同历史版本与删除标记一起删；失败不阻塞发布（发布本身已经成功）。
        if: env.PUBLISH_PREVIEW == 'true' && steps.oss_sdk.outcome == 'success'
        continue-on-error: true
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
        run: python3 .github/scripts/oss_prune_previews.py --keep 5

      - name: Fail if OSS stable publish failed
        if: github.ref == 'refs/heads/main' && steps.oss_publish.outcome != 'success'
        run: |
          echo "::error::OSS primary publish failed; GitHub/Gitee fallback was published. Re-run the workflow to fix OSS."
          exit 1

      - name: Fail if OSS preview publish failed
        if: env.PUBLISH_PREVIEW == 'true' && steps.oss_preview_publish.outcome != 'success'
        run: |
          echo "::error::OSS preview publish failed; GitHub pre-release fallback was published. Re-run the workflow to fix OSS."
          exit 1
