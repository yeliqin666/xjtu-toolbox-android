name: Feedback digest

# 飞书反馈表 → 崩溃日报（issue）+ 反馈日报（讨论，一条反馈一层楼），/reply、/skip 回写飞书回复表。
# 细节见 .github/scripts/feedback_digest.py。
#
# 定时（每天北京时间 08:30 = UTC 00:30）：发两类日报（没有新内容就不发），再补处理漏掉的命令。
# 手动：workflow_dispatch，可选 dry_run（只打印不写）。
# 「大家在问」和投票统计在 announce.yml。
# 评论：讨论里的 /reply、/skip 由 discussion-commands.yml 统一接收（和 /toissue 同一个入口）；
#   这里只管旧的反馈日报 issue（带 feedback 标签）。评论事件只认默认分支上的 workflow，改动要先合到 main。
#
# 仓库变量（Settings → Variables，可不设）：
#   FEEDBACK_MODERATION           off / mark（默认，Qwen3Guard 只标记、折叠疑似违规）/ block（疑似违规不展示正文）
#   CRASH_MIN_VERSION             崩溃日报的最低版本，默认 5.1.1
#   FEEDBACK_DISCUSSION_CATEGORY  反馈日报所在的讨论分类，默认「反馈日报」（需先在网页上建好，格式选 Announcement）

on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只打印，不发帖、不写飞书'
        type: boolean
        default: false
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  discussions: write

env:
  FEEDBACK_APP_ID: ${{ secrets.FEEDBACK_APP_ID }}
  FEEDBACK_APP_SECRET: ${{ secrets.FEEDBACK_APP_SECRET }}
  FEEDBACK_BASE_TOKEN: ${{ secrets.FEEDBACK_BASE_TOKEN }}
  FEEDBACK_TABLE_SUBMIT: ${{ secrets.FEEDBACK_TABLE_SUBMIT }}
  FEEDBACK_TABLE_REPLY: ${{ secrets.FEEDBACK_TABLE_REPLY }}
  FEEDBACK_DISCUSSION_CATEGORY: ${{ vars.FEEDBACK_DISCUSSION_CATEGORY || '反馈日报' }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  WINDOW_DAYS: '7'

jobs:
  digest:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: feedback-digest
      cancel-in-progress: false
    env:
      MODERATION: ${{ vars.FEEDBACK_MODERATION || 'mark' }}
      CRASH_MIN_VERSION: ${{ vars.CRASH_MIN_VERSION || '5.1.1' }}
      DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
      HF_HOME: ${{ github.workspace }}/.hf
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: env.MODERATION != 'off'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/workflows/feedback-digest.yml

      - name: Cache guard model
        if: env.MODERATION != 'off'
        uses: actions/cache@v4
        with:
          path: .hf
          key: qwen3guard-gen-0.6b-v1

      - name: Install guard deps
        if: env.MODERATION != 'off'
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install 'transformers>=4.51' accelerate

      - name: Digest
        run: python3 .github/scripts/feedback_digest.py digest

  # 旧的反馈日报 issue 里的 /reply、/skip；那几期处理完就可以删掉这个 job
  reply-issue:
    if: >-
      github.event_name == 'issue_comment' &&
      !github.event.issue.pull_request &&
      contains(github.event.issue.labels.*.name, 'feedback') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      (contains(github.event.comment.body, '/reply') || contains(github.event.comment.body, '/skip'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: feedback-reply-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Handle command
        run: python3 .github/scripts/feedback_digest.py comment ${{ github.event.issue.number }} ${{ github.event.comment.id }}
