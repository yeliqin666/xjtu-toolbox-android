name: Sync announce to Gitee

on:
  push:
    branches: [ announce ]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push announce to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_ACCESS_TOKEN }}
          GITEE_URL: https://gitee.com/yeliqin666/xjtu-toolbox-android.git
          # 拿不到凭据就直接失败，不要在无人值守的 CI 上等输入框
          GIT_TERMINAL_PROMPT: "0"
        run: |
          if [ -z "$GITEE_TOKEN" ]; then
            echo "::error::GITEE_ACCESS_TOKEN missing"
            exit 1
          fi
          if [ -f .git/shallow ]; then
            git fetch --unshallow
          fi
          # token 不拼进 remote URL：URL 会被 git 写进 .git/config，之后任何
          # `git remote -v` 或 push 报错都可能把它打出来。URL 保持干净，凭据只经 env
          # 交给 credential helper（.git/config 里存下的也只是对 $GITEE_TOKEN 的引用）。
          git remote add gitee "$GITEE_URL" 2>/dev/null || git remote set-url gitee "$GITEE_URL"
          git config --local --replace-all 'credential.https://gitee.com.helper' \
            '!f() { echo "username=yeliqin666"; echo "password=$GITEE_TOKEN"; }; f'
          git push gitee HEAD:announce --force
          echo "announce branch synced to Gitee"
