name: Handle discussion commands

# 监听 Discussion 新评论里的命令，统一入口：
#
#   /toissue <type> <priority> [flags] [assignee]
#     type     bug / feature
#     priority 0 / 1 / 2 / 3
#     flags    q 加 Question；t 把 Awaiting Assignment 换成 Awaiting Triage
#     assignee @用户名，可省略；指定后状态标签用 In Progress（t 优先）
#     顶层回复默认转换讨论主帖，楼中楼默认转换父评论（replyTo）。
#     命令后空一行写 `## 标题`，再空一行写正文时，用这段内容作为 issue；
#     没有 `## 标题` 时忽略后面的文字，回退到默认来源。
#     已转换过的来源会在 issue 正文里留隐藏标记，重复命令只更新/回链，不会重复建 issue。
#
#   /attachcomment <issue_no>
#     issue_no 必填，`#123` 或 `GH-123`；把内容以评论形式附加到已有 issue。
#     顶层回复附加主帖（`## 标题` + 正文）；楼中楼附加被回复的评论。
#     命令后空一行写的内容（details）覆盖默认来源；楼中楼 details 开头的
#     自动引用块会去掉，没有 details 时命令开头的引用块当作附加内容。
#
#   /update-market [url] [--tags a,b] [--featured|--no-featured] [--dry-run]
#     把插件公告帖里的 zip 收进在线市场索引（dzhz-server 的 services/web/public/plugin-market.json）：
#     验 ECDSA P-256 签名、核对 files[] 清单、按 versionCode 防回退，用 Git Data API 一次提交；
#     签名钥匙按 TOFU 钉在 dzhz-server 的 .github/plugin-market-keys.json。
#     只收 plugin-release（插件公告）分类，要求仓库 admin 权限，写索引用 MARKET_SYNC_TOKEN。
#     推荐在对应版本的更新跟帖下面回复；顶层也能跑，但会退到最新的跟帖并提醒一次。
#
# 只有仓库 write / maintain / admin 权限的作者会触发；权限不足静默跳过。
# GitHub 不允许回复楼中楼，所以对楼中楼命令的回复会落在同一线程顶层，并引用具体评论。
# 命令要求单独占一行（行首可有空格）；引用行（>）和围栏代码块里的不算。
# 注意：discussion_comment 事件只认默认分支上的 workflow，改动要先合到 main。

on:
  discussion_comment:
    types: [created]

# 读取讨论、创建/更新 issue、回帖都需要写权限。
permissions:
  contents: read
  discussions: write
  issues: write
  # /tally 派发 announce.yml / vote-tally.yml（GITHUB_TOKEN 能触发 workflow_dispatch）
  actions: write

# 同一来源（顶层评论 → 主帖；楼中楼 → 父评论）的命令串行处理，避免并发建出两个 issue。
# 不按整个讨论分组：同组只保留一个排队中的运行，连着在日报各楼发命令会把中间的取消掉。
concurrency:
  group: discussion-commands-${{ github.event.discussion.number }}-${{ github.event.comment.parent_id || 'top' }}
  cancel-in-progress: false

jobs:
  commands:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Handle command
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENT_NODE_ID: ${{ github.event.comment.node_id }}
          FEEDBACK_BASE_URL: ${{ vars.FEEDBACK_BASE_URL || 'https://api.dzhz.top/feedback' }}
          FEEDBACK_ADMIN_TOKEN: ${{ secrets.FEEDBACK_ADMIN_TOKEN }}
          FEEDBACK_CATEGORY: ${{ vars.FEEDBACK_CATEGORY || '用户反馈' }}
          ANNOUNCE_CATEGORY: ${{ vars.ANNOUNCE_CATEGORY || 'announcements' }}
          # /update-market 写 dzhz-server 的索引：fine-grained PAT，只要 Contents 读写
          MARKET_SYNC_TOKEN: ${{ secrets.MARKET_SYNC_TOKEN }}
          MARKET_REPO: ${{ vars.MARKET_REPO || 'xjtu-dzhz/dzhz-server' }}
          PLUGIN_CATEGORY: ${{ vars.PLUGIN_CATEGORY || 'plugin-release' }}
        run: python3 .github/scripts/discussion_commands.py
