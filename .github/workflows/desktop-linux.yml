name: Desktop Linux Packaging

# 出 .deb 与免安装 tar.gz。PR 上只在打包配置、图标或版本目录变动时验证出包（编译与测试在 pr-gate.yml）；
# 正式发版时由 build.yml 在安卓 Release 发完后调用，把产物挂到同一个 Release（不走 OSS）。

on:
  pull_request:
    paths:
      - 'desktop/build.gradle.kts'
      - 'desktop/icons/**'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/desktop-linux.yml'
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: true
  workflow_dispatch:

concurrency:
  group: desktop-linux-${{ github.ref }}-${{ inputs.release_tag }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - uses: gradle/actions/setup-gradle@v4

      - name: 打 .deb 与 tar.gz
        env:
          FEEDBACK_APP_ID: ${{ secrets.FEEDBACK_APP_ID }}
          FEEDBACK_APP_SECRET: ${{ secrets.FEEDBACK_APP_SECRET }}
          FEEDBACK_BASE_TOKEN: ${{ secrets.FEEDBACK_BASE_TOKEN }}
          FEEDBACK_TABLE_SUBMIT: ${{ secrets.FEEDBACK_TABLE_SUBMIT }}
          FEEDBACK_TABLE_REPLY: ${{ secrets.FEEDBACK_TABLE_REPLY }}
        run: ./gradlew :desktop:packageDeb :desktop:packageTarGz

      # linux.iconFile 指错不会报错，只会静默换成 Compose 默认图标，所以比对包里那张与仓库里的 md5
      - name: 核对包内图标
        run: |
          set -eux
          deb=$(ls desktop/build/compose/binaries/main/deb/*.deb)
          dpkg-deb -I "$deb"
          packed=$(dpkg-deb --fsys-tarfile "$deb" | tar -xO ./opt/xjtu-dzhz/lib/xjtu-dzhz.png | md5sum | cut -d' ' -f1)
          ours=$(md5sum desktop/icons/linux.png | cut -d' ' -f1)
          [ "$packed" = "$ours" ]

      - uses: actions/upload-artifact@v4
        with:
          name: xjtu-dzhz-linux
          path: |
            desktop/build/compose/binaries/main/deb/*.deb
            desktop/build/compose/binaries/main/tar/*.tar.gz
          # Compose 对宿主不支持的格式会静默 SKIPPED，没产物就当失败
          if-no-files-found: error

      - name: 挂到 Release
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "${{ inputs.release_tag }}" --repo "${{ github.repository }}" --clobber
          desktop/build/compose/binaries/main/deb/*.deb
          desktop/build/compose/binaries/main/tar/*.tar.gz
