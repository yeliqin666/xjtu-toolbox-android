# 维护者：核实后在网页上「转为讨论」放进 Announcements 分类即可发布（announce.py 按最后一项「### 正文」取内容，
# 标题开头的「[系统]」自动去掉）。正文空着会被机器人回执拦下，补上再保存；恢复了就关帖撤下。
name: 校园系统状态
description: 学校某系统挂了、在维护、已恢复——热心同学用来通知大家，不是报盒子自己的 Bug
title: "[系统] "
body:
  - type: markdown
    attributes:
      value: |
        盒子能连上，但学校那边异常时，用这一张表。维护者核实后会把它转成应用内公告。

        盒子闪退、页面错乱请走「缺陷反馈」。不要贴密码、验证码、Cookie、完整学号。
  - type: dropdown
    id: system
    attributes:
      label: 哪个系统
      options:
        - 统一认证 / CAS / 扫码登录
        - WebVPN / 校外访问
        - 教务（课表、成绩、考试、评教）
        - 校园卡 / 消费
        - 图书馆
        - 思源学堂
        - 电费 / 水控
        - 其它（下面写清）
    validations:
      required: true
  - type: dropdown
    id: status
    attributes:
      label: 现在怎样
      options:
        - 打不开 / 一直转圈 / 报错
        - 学校公告维护中
        - 部分功能不行（请在下面写清）
        - 已经恢复，可以撤提示了
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 你怎么确认的
      description: 大致时间、校内还是校外、网页和盒子是否一样。有官方维护通知可以贴链接，不要贴自己的登录过程。
      placeholder: |
        例如：今晚 18:30 起校外 WebVPN 进教务 502，校内网页同样进不去
        例如：信息化通知说统一认证今晚检修到 22:00
    validations:
      required: true
  - type: textarea
    id: suggest
    attributes:
      # 标题必须就叫「正文」：转为讨论后公告脚本按「### 正文」取这一段显示在 App 里
      label: 正文
      description: 希望大家在盒子里看到的话（可选）。一两句人话即可，文案和维护者一起定；没有就空着。
      placeholder: 例如：统一认证今晚检修到 22:00，期间登录不了，之后再试
