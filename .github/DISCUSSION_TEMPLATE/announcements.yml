# 公告分类（slug 必须是 announcements，文件名跟 slug 走；GitHub 不认中文 slug）的发帖表单。帖子标题 = 公告标题；发出、编辑、关闭后由 .github/workflows/announce.yml
# 同步进 App 的公告（bulletin.json → announce 分支 / Gitee）。之后直接改帖子正文也行，保留「### 小标题」结构即可。
# 不写 title：GitHub 不接受空字符串，填了又会成为标题前缀进到 App 里。
body:
  - type: markdown
    attributes:
      value: |
        发出后几分钟内进 App。**改帖子 = 改公告；关帖 = 删除（投票也一样，要提前结束投票就改截止时间）**。
        填了「投票选项」就是投票：票写进反馈后端，每 4 天统计一次，结果回到本帖。机器人会在帖子里回复解析结果。
  - type: dropdown
    id: level
    attributes:
      label: 等级
      description: 普通 / 提醒在首页公告条；重要、强制更新会弹窗
      options:
        - 普通
        - 提醒
        - 更新
        - 重要
        - 强制更新
      default: 0
    validations:
      required: true
  - type: textarea
    id: body
    attributes:
      label: 正文
      description: App 支持 Markdown 排版，例如标题、列表、强调和链接
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: 链接
      description: 可不填；点公告打开的地址
  - type: input
    id: starts
    attributes:
      label: 开始时间
      description: 可不填（立即生效）。格式 2026-12-01 或 2026-12-01 08:00，北京时间
  - type: input
    id: ends
    attributes:
      label: 截止时间
      description: 可不填（一直显示）。投票不填默认 7 天后 23:59
  - type: input
    id: min_version
    attributes:
      label: 最低版本
      description: 可不填；低于这个版本的不显示，如 6.0.2
  - type: input
    id: max_version
    attributes:
      label: 最高版本
      description: 可不填；高于这个版本的不显示
  - type: input
    id: force_below
    attributes:
      label: 低于此版本强制更新
      description: 可不填；只对「更新」等级有意义
  - type: textarea
    id: options
    attributes:
      label: 投票选项
      description: 可不填。每行一个，2～10 个；写一行「其他」= 附一个自己填的框
  - type: checkboxes
    id: flags
    attributes:
      label: 设置
      options:
        - label: 投票可多选
        - label: 必须点确认才能关掉
        - label: 启动时拦住不让用（慎用）
