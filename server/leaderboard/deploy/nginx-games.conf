# 小游戏全服榜：加到**你站点 nginx 的 443 server 块里**（Debian/Ubuntu 上一般是
# /etc/nginx/conf.d/ 或 sites-enabled/ 下的站点配置），位置放在 `location /` 之前
# （前缀 location 取最长匹配，^~ 保证不被下面的正则抢走）。
#
# 注意 proxy_pass 结尾**不带斜杠**，和上面 /api/ 的写法一致：路径原样透传，
# 服务端自己认 /games/board、/games/score（index.js 里也兼容去掉前缀的写法）。
location ^~ /games/ {
    proxy_pass http://127.0.0.1:4100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    # 请求体只可能是 {game,uid,name,score} 这点东西，卡死 4k
    client_max_body_size 4k;
}
