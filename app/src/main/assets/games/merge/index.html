<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>合成西交大</title>
<style>
  /*
   * 本页面完全离线，不引用任何外部字体 / CDN / 图片，全部资源来自 app 内 assets。
   * 深浅色由宿主通过 URL 参数 ?dark=1 传入（WebView 的 prefers-color-scheme 不一定跟 App 主题走）。
   */
  :root {
    --bg-top: #EAF1FF;
    --bg-bottom: #F7F9FE;
    --jar: linear-gradient(180deg, #FFFFFF 0%, #F2F6FD 100%);
    --jar-border: rgba(11, 79, 156, 0.10);
    --jar-shadow: 0 10px 30px rgba(11, 79, 156, 0.12);
    --ink: #0B2545;
    --ink-soft: rgba(11, 37, 69, 0.55);
    --accent: #0B5CAD;
    --accent-2: #3B8BEB;
    --pill: rgba(255, 255, 255, 0.85);
    --scrim: rgba(8, 20, 40, 0.38);
    --card: #FFFFFF;
  }
  :root.dark {
    --bg-top: #0E141D;
    --bg-bottom: #121A25;
    --jar: linear-gradient(180deg, #1A2332 0%, #151D29 100%);
    --jar-border: rgba(140, 180, 255, 0.10);
    --jar-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
    --ink: #E6EEF9;
    --ink-soft: rgba(230, 238, 249, 0.55);
    --accent: #5AA2F5;
    --accent-2: #8CC0FF;
    --pill: rgba(30, 40, 56, 0.85);
    --scrim: rgba(0, 0, 0, 0.5);
    --card: #1B2433;
  }
  * { box-sizing: border-box; padding: 0; margin: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%;
    background: linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    overflow: hidden;
    touch-action: none;
    color: var(--ink);
  }
  .container {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    position: relative; padding: 12px;
  }
  #game-wrap {
    position: relative;
    border-radius: 28px;
    background: var(--jar);
    border: 1px solid var(--jar-border);
    box-shadow: var(--jar-shadow);
    overflow: hidden;
  }
  #game-canvas { position: relative; display: block; touch-action: none; }
  /* HUD 按 640x960 的世界坐标排版，再整体 scale，和画布同比例缩放 */
  #game-ui {
    position: absolute; left: 0; top: 0;
    pointer-events: none; user-select: none;
    display: none; transform-origin: top left;
  }
  #hud-score {
    position: absolute; left: 28px; top: 20px;
  }
  #game-score {
    font-size: 56px; font-weight: 800; line-height: 1;
    font-variant-numeric: tabular-nums;
    background: linear-gradient(180deg, var(--accent-2), var(--accent));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    transition: transform 0.12s ease-out;
    transform-origin: left center;
  }
  #game-score.bump { transform: scale(1.08); }
  #game-best {
    margin-top: 6px; font-size: 20px; font-weight: 600; color: var(--ink-soft);
  }
  #game-next-wrap {
    position: absolute; right: 24px; top: 22px;
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px 8px 18px; border-radius: 999px;
    background: var(--pill);
    box-shadow: 0 4px 14px rgba(11, 79, 156, 0.10);
    font-size: 20px; font-weight: 600; color: var(--ink-soft);
  }
  #game-next-fruit { width: 52px; height: 52px; display: block; }
  #game-end-container {
    position: absolute; inset: 0;
    display: none; align-items: center; justify-content: center;
    background-color: var(--scrim);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    animation: fade-in 0.25s ease-out;
  }
  #game-end {
    min-width: 62%;
    text-align: center; padding: 26px 28px 22px;
    background: var(--card);
    border-radius: 28px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
    pointer-events: auto; user-select: none;
    animation: pop-in 0.35s cubic-bezier(.2, 1.4, .4, 1);
  }
  #game-end-title { font-weight: 800; font-size: 22px; color: var(--ink); margin-bottom: 10px; }
  #game-end-score-value {
    display: block; font-size: 52px; font-weight: 800; line-height: 1.1;
    font-variant-numeric: tabular-nums;
    background: linear-gradient(180deg, var(--accent-2), var(--accent));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  #game-end-best { font-size: 15px; color: var(--ink-soft); margin: 6px 0 4px; }
  #game-end-record {
    display: none; margin: 6px auto 0; padding: 3px 12px; border-radius: 999px;
    font-size: 13px; font-weight: 700; color: #fff;
    background: linear-gradient(90deg, #FF8A3D, #FF4D6D);
    width: max-content;
  }
  #game-restart {
    margin-top: 18px; width: 100%;
    padding: 12px 0; border-radius: 16px;
    background: linear-gradient(180deg, var(--accent-2), var(--accent));
    color: #fff; font-size: 17px; font-weight: 700; border: none;
    box-shadow: 0 6px 16px rgba(11, 92, 173, 0.35);
  }
  #game-restart:active { transform: scale(0.97); }
  #celebrate {
    position: absolute; inset: 0;
    display: none; align-items: center; justify-content: center;
    pointer-events: none; z-index: 20;
  }
  #celebrate span {
    font-size: 40px; font-weight: 900;
    background: linear-gradient(90deg, #FFB547, #FF5E7E, #6C8CFF);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.2));
    animation: celebrate-pop 1.1s ease-out forwards;
  }
  @keyframes celebrate-pop {
    0% { transform: scale(0.3) rotate(-6deg); opacity: 0; }
    30% { transform: scale(1.15) rotate(2deg); opacity: 1; }
    55% { transform: scale(1.0) rotate(0); }
    100% { transform: scale(1.05) translateY(-20px); opacity: 0; }
  }
  @keyframes pop-in { from { transform: scale(0.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
</style>
<script>
  if (/[?&]dark=1/.test(location.search)) document.documentElement.classList.add('dark');
</script>
</head>
<body>
  <div class="container">
    <div id="game-wrap">
      <canvas id="game-canvas"></canvas>
      <div id="game-ui">
        <div id="hud-score">
          <div id="game-score">0</div>
          <div id="game-best">最高 <span id="game-highscore-value">0</span></div>
        </div>
        <div id="game-next-wrap">
          下一个
          <canvas id="game-next-fruit"></canvas>
        </div>
      </div>
      <div id="celebrate"><span id="celebrate-text">合成西交大！</span></div>
      <div id="game-end-container">
        <div id="game-end">
          <div id="game-end-title">本局得分</div>
          <span id="game-end-score-value">0</span>
          <div id="game-end-best">最高分 <span id="game-end-best-value">0</span></div>
          <div id="game-end-record">新纪录</div>
          <button id="game-restart">再来一局</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Matter.js 物理引擎，MIT 协议，见 THIRD_PARTY_NOTICES.merge.md -->
  <script src="./matter.min.js"></script>
  <script src="./index.js"></script>
</body>
</html>
